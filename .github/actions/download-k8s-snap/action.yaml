name: Download k8s-snap

inputs:
  # Download k8s-snap using either a GH action artifact or a snap channel.
  artifact:
    description: The name of a GH action artifact.
    type: string
  channel:
    description: k8s snap channel.
    type: string

outputs:
  snap-path:
    description: The *.snap destination path.
    value: ${{ steps.retrieve-path.outputs.snap-path }}

runs:
  using: "composite"
  steps:
    - name: Fail if neither artifact nor channel are specified
      if: inputs.artifact == '' && inputs.channel == ''
      shell: bash
      run: |
        echo "No k8s-snap artifact or channel specified..."
        exit 1
    - name: Fail if both artifact and channel are specified
      if: inputs.artifact != '' && inputs.channel != ''
      shell: bash
      run: |
        echo "Received snap artifact AND snap channel."
        exit 1

    - name: Download snap artifact
      if: inputs.artifact != ''
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ${{ inputs.artifact }}
        path: ${{ github.workspace }}

    - name: Download snap channel
      if: inputs.channel != ''
      shell: bash
      env:
        INPUT_CHANNEL: ${{ inputs.channel }}
      run: |
        # Retry with exponential backoff to survive transient network/Snap Store errors.
        max_attempts=5
        delay=5
        for attempt in $(seq 1 "$max_attempts"); do
          if snap download k8s --channel="$INPUT_CHANNEL" --basename k8s; then
            break
          fi
          if [[ "$attempt" -eq "$max_attempts" ]]; then
            echo "snap download failed after $max_attempts attempts"
            exit 1
          fi
          echo "snap download failed (attempt $attempt/$max_attempts), retrying in ${delay}s..."
          sleep "$delay"
          delay=$((delay * 2))
        done
        full_path=`realpath k8s.snap`
        echo "Downloaded snap: $full_path"
        ls -lh $full_path

    - name: Retrieve resulting snap path
      shell: bash
      id: retrieve-path
      env:
        INPUT_ARTIFACT: ${{ inputs.artifact }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        ARTIFACT=$(printf '%s' "$INPUT_ARTIFACT" | tr -d '\r\n')
        if [[ -n "$ARTIFACT" ]]; then
          snap_path="${WORKSPACE}/${ARTIFACT}"
        else
          snap_path="${WORKSPACE}/k8s.snap"
        fi
        echo "snap-path=$snap_path" >> "$GITHUB_OUTPUT"

        echo "Output snap: $snap_path"
        ls -lh $snap_path
