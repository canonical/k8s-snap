name: Download k8s-snap

inputs:
  # Download k8s-snap using either a GH action artifact or a snap channel.
  artifact:
    description: The name of a GH action artifact.
    type: string
  channel:
    description: k8s snap channel.
    type: string

outputs:
  snap-path:
    description: The *.snap destination path.
    value: ${{ steps.retrieve-path.outputs.snap-path }}
  snap-revision:
    description: Store revision of the downloaded snap (empty for artifact builds).
    value: ${{ steps.download-channel.outputs.snap-revision }}

runs:
  using: "composite"
  steps:
    - name: Fail if neither artifact nor channel are specified
      if: inputs.artifact == '' && inputs.channel == ''
      shell: bash
      run: |
        echo "No k8s-snap artifact or channel specified..."
        exit 1
    - name: Fail if both artifact and channel are specified
      if: inputs.artifact != '' && inputs.channel != ''
      shell: bash
      run: |
        echo "Received snap artifact AND snap channel."
        exit 1

    - name: Validate artifact name
      if: inputs.artifact != ''
      shell: bash
      env:
        INPUT_ARTIFACT: ${{ inputs.artifact }}
      run: |
        CLEAN_ARTIFACT=$(printf '%s' "$INPUT_ARTIFACT" | tr -d '\r\n')
        artifact=$(basename -- "$CLEAN_ARTIFACT")
        if [[ -z "$artifact" || "$artifact" == "." || "$artifact" == ".." || "$artifact" == *"/"* || "$artifact" != "$CLEAN_ARTIFACT" ]]; then
          echo "Invalid artifact name: $INPUT_ARTIFACT"
          exit 1
        fi

    - name: Download snap artifact (attempt 1)
      id: download-artifact-1
      if: inputs.artifact != ''
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ${{ inputs.artifact }}
        path: ${{ github.workspace }}

    - name: Cleanup and backoff after attempt 1
      if: inputs.artifact != '' && steps.download-artifact-1.outcome == 'failure'
      shell: bash
      env:
        INPUT_ARTIFACT: ${{ inputs.artifact }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        CLEAN_ARTIFACT=$(printf '%s' "$INPUT_ARTIFACT" | tr -d '\r\n')
        artifact=$(basename -- "$CLEAN_ARTIFACT")
        echo "Attempt 1 failed. Cleaning up partial download for ${artifact}..."
        rm -rf "${WORKSPACE:?}/${artifact}"
        sleep $((10 + RANDOM % 15))

    - name: Download snap artifact (attempt 2)
      id: download-artifact-2
      if: inputs.artifact != '' && steps.download-artifact-1.outcome == 'failure'
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ${{ inputs.artifact }}
        path: ${{ github.workspace }}

    - name: Cleanup and backoff after attempt 2
      if: inputs.artifact != '' && steps.download-artifact-2.outcome == 'failure'
      shell: bash
      env:
        INPUT_ARTIFACT: ${{ inputs.artifact }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        CLEAN_ARTIFACT=$(printf '%s' "$INPUT_ARTIFACT" | tr -d '\r\n')
        artifact=$(basename -- "$CLEAN_ARTIFACT")
        echo "Attempt 2 failed. Cleaning up partial download for ${artifact}..."
        rm -rf "${WORKSPACE:?}/${artifact}"
        sleep $((25 + RANDOM % 20))

    - name: Download snap artifact (attempt 3)
      id: download-artifact-3
      if: inputs.artifact != '' && steps.download-artifact-2.outcome == 'failure'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ${{ inputs.artifact }}
        path: ${{ github.workspace }}
    - name: Download snap channel
      if: inputs.channel != ''
      uses: $/.github/actions/retry-command
      env:
        INPUT_CHANNEL: ${{ inputs.channel }}
      with:
        max_attempts: 5
        timeout_minutes: 3
        retry_wait_seconds: 10
        command: |
          rm -f k8s.snap k8s.assert
          snap download k8s --channel="$INPUT_CHANNEL" --basename k8s
          full_path=`realpath k8s.snap`
          echo "Downloaded snap: $full_path"
          ls -lh $full_path

    - name: Record downloaded snap revision
      if: inputs.channel != ''
      id: download-channel
      shell: bash
      run: |
        revision=$(awk '/^snap-revision: /{print $2; exit}' k8s.assert || true)
        echo "Downloaded revision: ${revision:-unknown}"
        echo "snap-revision=$revision" >> "$GITHUB_OUTPUT"

    - name: Retrieve resulting snap path
      shell: bash
      id: retrieve-path
      env:
        INPUT_ARTIFACT: ${{ inputs.artifact }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        CLEAN_ARTIFACT=$(printf '%s' "$INPUT_ARTIFACT" | tr -d '\r\n')
        ARTIFACT=$(basename -- "$CLEAN_ARTIFACT")
        if [[ -n "$ARTIFACT" && "$ARTIFACT" != "." && "$ARTIFACT" != ".." && "$ARTIFACT" != *"/"* && "$ARTIFACT" == "$CLEAN_ARTIFACT" ]]; then
          snap_path="${WORKSPACE}/${ARTIFACT}"
        else
          snap_path="${WORKSPACE}/k8s.snap"
        fi
        echo "snap-path=$snap_path" >> "$GITHUB_OUTPUT"

        echo "Output snap: $snap_path"
        ls -lh $snap_path
