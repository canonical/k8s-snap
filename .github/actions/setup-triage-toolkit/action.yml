name: Set up AI Agent Toolkit
description: >-
  Check out the private k8s-ai-agent-toolkit with a scoped token and install it
  into a local virtualenv, leaving `ai-triage` on PATH after `source .venv/bin/activate`.

inputs:
    token:
        description: Token able to read canonical/k8s-ai-agent-toolkit
        required: true
    ref:
        description: Toolkit ref to install
        required: false
        default: feat/triage-bot-toolkit
    python-version:
        description: Python version for the virtualenv
        required: false
        default: "3.12"

runs:
    using: composite
    steps:
        - name: Setup Python
          uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
          with:
              python-version: ${{ inputs.python-version }}

        # Checked out with a scoped token rather than a credential helper: a
        # helper written into the runner's global git config outlives a failed
        # step on a self-hosted runner, and persist-credentials:false keeps the
        # token out of .git/config too.
        - name: Check out AI Agent Toolkit
          uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
          with:
              repository: canonical/k8s-ai-agent-toolkit
              ref: ${{ inputs.ref }}
              token: ${{ inputs.token }}
              path: .toolkit
              persist-credentials: false

        - name: Install AI Agent Toolkit
          shell: bash
          run: |
              python -m venv .venv
              source .venv/bin/activate
              pip install ./.toolkit
