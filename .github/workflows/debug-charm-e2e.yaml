name: Debug Charm e2e (Snap Store Stall)

permissions:
  contents: read
  actions: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  public-sweep:
    name: Public Sweep (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run public per-IP sweep
        run: |
          chmod +x .github/scripts/run-sweep.sh .github/scripts/summarize-sweep.py
          bash .github/scripts/run-sweep.sh public "" "/tmp/public-sweep.txt"
          python3 .github/scripts/summarize-sweep.py "/tmp/public-sweep.txt"

      - name: Upload public sweep artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: public-sweep-results
          path: /tmp/public-sweep.txt
          retention-days: 7

  egress-sweep:
    name: Egress Sweep (Job ${{ matrix.attempt }}/3)
    runs-on: self-hosted-linux-amd64-jammy-xlarge
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]

    env:
      ARTIFACT_DIR: ${{ github.workspace }}/sweep-artifacts

    steps:
      - name: Start tmate session
        id: tmate
        timeout-minutes: 5
        continue-on-error: true
        uses: canonical/action-tmate@main
        with:
          detached: true

      - name: Display tmate connection command
        run: |
          echo "================================================================================"
          echo "TMATE SSH COMMAND (Job ${{ matrix.attempt }}/3):"
          echo "${{ steps.tmate.outputs.ssh-command }}"
          echo "TMATE WEB URL: ${{ steps.tmate.outputs.web-url }}"
          echo "================================================================================"

      - name: Save and upload early tmate connection info
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/tmate-info
          echo "${{ steps.tmate.outputs.ssh-command }}" > /tmp/tmate-info/tmate-ssh.txt
          echo "${{ steps.tmate.outputs.web-url }}" > /tmp/tmate-info/tmate-web.txt

      - name: Upload early tmate artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: tmate-session-sweep-${{ matrix.attempt }}
          path: /tmp/tmate-info
          retention-days: 1

      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tcpdump iputils-ping iputils-tracepath jq curl
      - name: Setup LXD
        id: setup-lxd
        timeout-minutes: 10
        uses: canonical/setup-lxd@a3c85fc6fb7fff43fcfeae87659e41a8f635b7dd # v0.1.3

      - name: Disable LXD IPv6 and launch container
        run: |
          lxc network set lxdbr0 ipv6.address none
          lxc launch ubuntu:24.04 c1
          sleep 10
          lxc exec c1 -- cloud-init status --wait || true
          lxc exec c1 -- apt-get update
          lxc exec c1 -- apt-get install -y curl iproute2

      - name: Create artifact directories
        run: |
          mkdir -p "${{ env.ARTIFACT_DIR }}/pcaps" "${{ env.ARTIFACT_DIR }}/reports" "${{ env.ARTIFACT_DIR }}/host"

      - name: Host and Squid path diagnostics
        run: |
          {
            echo "=== Host Network Diagnostics ==="
            ip -d link
            echo "--- sysctl MTU settings ---"
            sysctl net.ipv4.tcp_mtu_probing net.ipv4.ip_no_pmtu_disc
            echo "--- aproxy configuration ---"
            snap info aproxy || true
            sudo snap get aproxy || true
            cat /var/snap/aproxy/current/* 2>/dev/null || true
            sudo nft list ruleset || true
          } | tee "${{ env.ARTIFACT_DIR }}/host/diagnostics.txt"

          SQUID_URL=$(sudo snap get aproxy proxy 2>/dev/null || grep -oE 'http://[^ "]+:3128' /var/snap/aproxy/current/* 2>/dev/null | head -n 1 || true)
          [ -z "$SQUID_URL" ] && SQUID_URL="http://squid.internal:3128"
          SQUID_HOST=$(echo "$SQUID_URL" | sed -e 's|http://||' -e 's|:3128.*||')
          echo "Discovered Squid Proxy: $SQUID_URL ($SQUID_HOST)"
          echo "$SQUID_URL" > "${{ env.ARTIFACT_DIR }}/host/squid-url.txt"

          {
            echo "=== Squid Path Diagnostics ($SQUID_HOST) ==="
            getent ahosts "$SQUID_HOST" || true
            SQUID_IPS=$(getent ahostsv4 "$SQUID_HOST" 2>/dev/null | awk '{print $1}' | sort -u || true)
            for sip in $SQUID_IPS; do
              echo "--- Diagnostics for Squid IP: $sip ---"
              ip route get "$sip" || true
              ping -M do -s 1472 -c 3 "$sip" || true
              ping -M do -s 8914 -c 3 "$sip" || true
              tracepath -n "$sip" || true
            done
          } | tee "${{ env.ARTIFACT_DIR }}/host/squid-pings.txt"

      - name: Start packet captures
        run: |
          sudo tcpdump -U -Z root -i ens3 -s 0 -w "${{ env.ARTIFACT_DIR }}/pcaps/ens3.pcap" 'tcp port 3128 or icmp' >/dev/null 2>&1 &
          echo $! > /tmp/tcpdump-ens3.pid
          sudo tcpdump -U -Z root -i lxdbr0 -s 0 -w "${{ env.ARTIFACT_DIR }}/pcaps/lxdbr0.pcap" 'tcp port 443' >/dev/null 2>&1 &
          echo $! > /tmp/tcpdump-lxdbr0.pid

      - name: Run sweep across all 3 paths
        run: |
          chmod +x .github/scripts/run-sweep.sh .github/scripts/summarize-sweep.py
          SQUID_URL=$(cat "${{ env.ARTIFACT_DIR }}/host/squid-url.txt")

          echo "=== 1. Container Sweep (aproxy path) ==="
          bash .github/scripts/run-sweep.sh container "" "${{ env.ARTIFACT_DIR }}/reports/container-baseline.txt" c1
          python3 .github/scripts/summarize-sweep.py "${{ env.ARTIFACT_DIR }}/reports/container-baseline.txt"

          echo "=== 2. Host Sweep with explicit Squid (-x $SQUID_URL) ==="
          bash .github/scripts/run-sweep.sh host-squid "$SQUID_URL" "${{ env.ARTIFACT_DIR }}/reports/host-squid.txt"
          python3 .github/scripts/summarize-sweep.py "${{ env.ARTIFACT_DIR }}/reports/host-squid.txt"

          echo "=== 3. Host Sweep Direct (no proxy) ==="
          bash .github/scripts/run-sweep.sh host-direct "" "${{ env.ARTIFACT_DIR }}/reports/host-direct.txt" || true
          python3 .github/scripts/summarize-sweep.py "${{ env.ARTIFACT_DIR }}/reports/host-direct.txt" || true

      - name: Run A/B variant sweep
        run: |
          if [ "${{ matrix.attempt }}" = "2" ]; then
            echo "=== A/B Variant: Lowering ens3 MTU to 1500 ==="
            sudo ip link set ens3 mtu 1500
            ip -d link show ens3
            bash .github/scripts/run-sweep.sh container "" "${{ env.ARTIFACT_DIR }}/reports/container-mtu1500.txt" c1
            python3 .github/scripts/summarize-sweep.py "${{ env.ARTIFACT_DIR }}/reports/container-mtu1500.txt"
          elif [ "${{ matrix.attempt }}" = "3" ]; then
            echo "=== A/B Variant: Enabling tcp_mtu_probing=1 ==="
            sudo sysctl -w net.ipv4.tcp_mtu_probing=1
            sysctl net.ipv4.tcp_mtu_probing
            bash .github/scripts/run-sweep.sh container "" "${{ env.ARTIFACT_DIR }}/reports/container-mtuprobing.txt" c1
            python3 .github/scripts/summarize-sweep.py "${{ env.ARTIFACT_DIR }}/reports/container-mtuprobing.txt"
          fi

      - name: Stop packet captures and analyze pcaps
        if: always()
        run: |
          if [ -f /tmp/tcpdump-ens3.pid ]; then
            sudo kill $(cat /tmp/tcpdump-ens3.pid) 2>/dev/null || true
          fi
          if [ -f /tmp/tcpdump-lxdbr0.pid ]; then
            sudo kill $(cat /tmp/tcpdump-lxdbr0.pid) 2>/dev/null || true
          fi
          sudo chown -R $USER:$USER "${{ env.ARTIFACT_DIR }}" || true

          {
            echo "=== PCAP Analysis (ens3 port 3128) ==="
            echo "Total packets captured on ens3: $(tcpdump -r "${{ env.ARTIFACT_DIR }}/pcaps/ens3.pcap" 2>/dev/null | wc -l)"
            echo "HTTP CONNECT requests and responses:"
            tcpdump -nn -A -r "${{ env.ARTIFACT_DIR }}/pcaps/ens3.pcap" 'tcp port 3128' 2>/dev/null | grep -E 'CONNECT |HTTP/1\.[01] [0-9]{3}' || true
            echo "TCP control packets:"
            tcpdump -nn -r "${{ env.ARTIFACT_DIR }}/pcaps/ens3.pcap" 'tcp[tcpflags] & (tcp-syn|tcp-fin|tcp-rst) != 0' 2>/dev/null | head -n 40 || true
            echo "ICMP Fragmentation Needed:"
            tcpdump -nn -r "${{ env.ARTIFACT_DIR }}/pcaps/ens3.pcap" 'icmp[icmptype] == 3 and icmp[icmpcode] == 4' 2>/dev/null || true

      - name: Upload sweep artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: sweep-artifacts-job-${{ matrix.attempt }}
          path: ${{ env.ARTIFACT_DIR }}
          retention-days: 7
