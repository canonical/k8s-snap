name: Debug Charm e2e (Snap Store Stall)

permissions:
  contents: read
  actions: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  public-investigation:
    name: Public TLS Investigation (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run public TLS trials
        run: |
          chmod +x .github/scripts/run-tls-investigation.sh
          bash .github/scripts/run-tls-investigation.sh public "" "/tmp/public-investigation"
          cat /tmp/public-investigation/summary.txt

      - name: Display representative failure logs
        if: always()
        run: |
          for f in /tmp/public-investigation/logs/*.log; do
            if [ -f "$f" ]; then
              echo "=== Verbose Log: $(basename "$f") ==="
              cat "$f"
              echo ""
            fi
          done

      - name: Upload public investigation artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: public-tls-investigation
          path: /tmp/public-investigation
          retention-days: 7

  selfhosted-investigation:
    name: Self-Hosted Squid Investigation
    runs-on: self-hosted-linux-amd64-jammy-xlarge
    timeout-minutes: 25
    steps:
      - name: Start tmate session
        id: tmate
        timeout-minutes: 5
        continue-on-error: true
        uses: canonical/action-tmate@main
        with:
          detached: true

      - name: Display tmate connection command
        run: |
          echo "================================================================================"
          echo "TMATE SSH COMMAND:"
          echo "${{ steps.tmate.outputs.ssh-command }}"
          echo "TMATE WEB URL: ${{ steps.tmate.outputs.web-url }}"
          echo "================================================================================"

      - name: Save and upload early tmate connection info
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/tmate-info
          echo "${{ steps.tmate.outputs.ssh-command }}" > /tmp/tmate-info/tmate-ssh.txt
          echo "${{ steps.tmate.outputs.web-url }}" > /tmp/tmate-info/tmate-web.txt

      - name: Upload early tmate artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: tmate-session-selfhosted
          path: /tmp/tmate-info
          retention-days: 1

      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Discover Squid proxy
        id: squid-discovery
        run: |
          SQUID_URL=$(sudo snap get aproxy proxy 2>/dev/null || grep -oE 'http://[^ "]+:3128' /var/snap/aproxy/current/* 2>/dev/null | head -n 1 || true)
          [ -z "$SQUID_URL" ] && SQUID_URL="http://egress.ps7.internal:3128"
          echo "squid-url=$SQUID_URL" >> "$GITHUB_OUTPUT"
          echo "Discovered Squid URL: $SQUID_URL"

      - name: Run Squid investigation trials
        run: |
          chmod +x .github/scripts/run-tls-investigation.sh
          bash .github/scripts/run-tls-investigation.sh squid "${{ steps.squid-discovery.outputs.squid-url }}" "/tmp/squid-investigation"
          cat /tmp/squid-investigation/summary.txt

      - name: Display representative failure logs
        if: always()
        run: |
          for f in /tmp/squid-investigation/logs/*.log; do
            if [ -f "$f" ]; then
              echo "=== Verbose Log: $(basename "$f") ==="
              cat "$f"
              echo ""
            fi
          done

      - name: Upload Squid investigation artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: squid-tls-investigation
          path: /tmp/squid-investigation
          retention-days: 7
