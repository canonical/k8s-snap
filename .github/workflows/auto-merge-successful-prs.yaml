name: Auto-merge Successful PRs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"  # Every 4 hours

permissions:
  contents: read

jobs:
  merge-successful-prs:
    runs-on: ubuntu-latest

    steps:
      - name: Checking out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Auto-merge pull requests if all status checks pass
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
            build-scripts/hack/auto-merge-successful-pr.py
