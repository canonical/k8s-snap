name: Build k8s-snap

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      arch:
        description: Job runner architecture (amd64 or arm64)
        default: amd64
        type: string
      flavor:
        description: k8s-snap flavor (e.g. strict)
        type: string
      go-snap-risk:
        description: |
          Optional Go snap risk level (e.g. candidate) to build with. When set,
          overrides the risk of the go/<track>/<risk> build-snap in
          snap/snapcraft.yaml. Leave empty to use the channel pinned in
          snap/snapcraft.yaml.
        type: string
        default: ""
    outputs:
      snap-artifact:
        description: Name of the uploaded snap artifact
        value: ${{ jobs.build-snap.outputs.snap-artifact }}

jobs:
  build-snap:
    name: Build snap
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    outputs:
      snap-artifact: ${{ steps.build.outputs.snap-artifact }}
    steps:
      - name: Checking out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Apply flavor-specific patches
        if: inputs.flavor != ''
        env:
          INPUT_FLAVOR: ${{ inputs.flavor }}
        run: |
          ./build-scripts/patches/"$INPUT_FLAVOR"/apply
      - name: Override Go snap risk
        if: inputs.go-snap-risk != ''
        env:
          GO_SNAP_RISK: ${{ inputs.go-snap-risk }}
        run: |
          # Swap only the risk so the Go track stays intact across bumps.
          sed -i -E "s|(- go/[^/[:space:]]+/)[^[:space:]]+|\1${GO_SNAP_RISK}|" snap/snapcraft.yaml
          grep -nE '^\s*- go/' snap/snapcraft.yaml
      - name: Setup LXD
        timeout-minutes: 20
        uses: $/.github/actions/setup-lxd
      - name: Install snapcraft
        uses: $/.github/actions/retry-command
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 5
          command: sudo snap install snapcraft --classic
      - name: Build k8s snap
        id: build
        timeout-minutes: 100
        env:
          flavor: ${{ inputs.flavor }}
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          if [[ -n "$flavor" ]]; then
            out_snap=k8s-$flavor-${INPUT_ARCH}.snap
          else
            out_snap=k8s-${INPUT_ARCH}.snap
          fi

          cleanup() {
            echo "Cleaning snapcraft LXD build instance..."
            timeout 2m sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- snapcraft clean --use-lxd 2>/dev/null || true
            if command -v lxc >/dev/null 2>&1; then
              timeout 30s lxc list --project snapcraft -c n --format csv 2>/dev/null | xargs -r -n 1 timeout 30s lxc delete --project snapcraft -f 2>/dev/null || true
              timeout 30s lxc list -c n --format csv 2>/dev/null | grep -E '^snapcraft-' | xargs -r -n 1 timeout 30s lxc delete -f 2>/dev/null || true
            fi
          }

          # Retry once after cleaning lingering LXD build state if build stalls.
          build_cmd=(sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- snapcraft --use-lxd)
          ret=0
          timeout -k 10s 45m "${build_cmd[@]}" || ret=$?
          if [ "$ret" -eq 124 ] || [ "$ret" -eq 137 ]; then
            echo "Snapcraft build timed out (exit code $ret); retrying once after cleanup..."
            cleanup
            ret=0
            timeout -k 10s 45m "${build_cmd[@]}" || ret=$?
            if [ "$ret" -ne 0 ]; then
              cleanup
              exit "$ret"
            fi
          elif [ "$ret" -ne 0 ]; then
            cleanup
            exit "$ret"
          fi

          mv k8s_*.snap "$out_snap"
          snap_listing="$(unsquashfs -l "$out_snap")"
          if grep -qE '^squashfs-root/(usr/)?bin/systemctl$' <<< "$snap_listing"; then
            echo "::error::Built snap contains unfiltered base packages (bin/systemctl); base snap manifest was missing during snapcraft build."
            exit 1
          fi

          echo "snap-artifact=$out_snap" >> "$GITHUB_OUTPUT"
      - name: Upload k8s snap
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.build.outputs.snap-artifact }}
          path: ${{ steps.build.outputs.snap-artifact }}
