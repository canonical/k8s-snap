name: Documentation Checks

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'build-scripts/components/k8sd/**'
      - 'ci/cmds/docs.py'
      - 'docs/tools/test_generate_charms_reference.py'
permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.changes.outputs.changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Get changed files list with git diff
        id: changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Fetch the base branch to ensure we have the history for the comparison
          git fetch origin "$BASE_REF"

          # Use git diff to find files changed between the base branch and the PR branch
          FILE_LIST=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- 'docs/canonicalk8s/**/*.md' | \
            sed 's|^docs/canonicalk8s/||' | \
            xargs)

          # Pass the space-delimited list to the step output
          echo "Changed files: $FILE_LIST"
          echo "changed_files=$FILE_LIST" >> $GITHUB_OUTPUT

  linkcheck:
    needs: prepare 
    uses: $/.github/workflows/linkcheck.yaml
    with:
      changed_files: ${{ needs.prepare.outputs.changed_files }}

  docs-spread-tests:
    needs: prepare
    uses: $/.github/workflows/docs-spread-tests.yaml
    with:
      changed_files: ${{ needs.prepare.outputs.changed_files }}

  spellcheck-and-inclusive-language:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7

    - id: spell-check
      name: Spell Check
      if: success() || failure()
      uses: canonical/documentation-workflows/spellcheck@e2998cc659396f43165fefde2d01c39b1a88d64c # main
      with:
        working-directory: docs/canonicalk8s

    - name: Inclusive Language Check
      id: woke-step
      if: success() || failure()
      uses: canonical/documentation-workflows/inclusive-language@e2998cc659396f43165fefde2d01c39b1a88d64c # main
      with:
        working-directory: docs/canonicalk8s

  reference-docs:
    # ubuntu-latest can resolve to ubuntu-26.04, whose GCC default
    # (-std=gnu23) breaks canonical/k8sd's libtirpc 1.3.3 build.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: 'stable'

      - name: Install Python dependencies
        run: |
          pip install --require-hashes -r ci/requirements-ci.txt

      - name: Test charm reference generation
        run: cd ci && tox -e test

      - name: Check k8sd API documentation
        if: success() || failure()
        run: python3 ci/k8s-ci.py docs update-k8sd-api

      - name: Check charm reference
        if: success() || failure()
        env:
          OPERATOR_REF: ${{ github.base_ref || github.ref_name }}
        run: python3 ci/k8s-ci.py docs update-charm-reference --operator-ref "$OPERATOR_REF"
