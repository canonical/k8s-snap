name: Trivy Security Scan

# Deliberately not triggered by pull_request. This scans the published channels
# on the release branches rather than a PR's own changes, and it files CVE
# tickets into Jira, which must not happen from a PR run. The PR's own snap is
# scanned by the security-scan job in lint_and_integration.yaml, which also
# exercises security-scan.yaml. Use workflow_dispatch to test an edit.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Runs every midnight

permissions:
  contents: read
  actions: read

jobs:
  Trivy:
    permissions:
     contents: read # for actions/checkout to fetch code
     # security-events: write is required for github/codeql-action/upload-sarif to upload SARIF results
     security-events: write
    strategy:
      matrix:
        include:
          # Latest branches
          - { branch: main, channel: latest/edge }
          # Stable branches
          # Add branches to test here
          # TODO: automatically retrieve the list of channels.
          - { branch: release-1.32, channel: 1.32-classic/edge }
          - { branch: release-1.33, channel: 1.33-classic/edge }
          - { branch: release-1.34, channel: 1.34-classic/edge }
          - { branch: release-1.35, channel: 1.35-classic/edge }
          - { branch: release-1.36, channel: 1.36-classic/edge }
    uses: ./.github/workflows/security-scan.yaml
    with:
      channel: ${{ matrix.channel }}
      checkout-ref: ${{ matrix.branch }}
      upload-reports-to-jira: true
    secrets: inherit
