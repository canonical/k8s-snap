name: Check for removed URLs

on:
  pull_request:
    paths:
      - 'docs/**'

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This implicitly gets the PR branch. Making it explicit causes problems
          # with private forks, but it is equivalent to the following:
          # repository: ${{ github.event.pull_request.head.repo.full_name }}
          # ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          fetch-depth: 0
          path: compare
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          persist-credentials: false
          fetch-depth: 0
          path: base
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      - name: Build docs
        run: |
          for dir in compare base; do
            pushd ${dir}/docs/canonicalk8s
            make html
            popd
          done
      - name: Generate current URLs list
        run: |
          for dir in compare base; do
            pushd ${dir}/docs/canonicalk8s
            find ./_build/ -name '*.html' \
            | sed 's|/_build||;s|/index.html$|/|;s|.html$||' \
            | sort > urls.txt
            popd
          done
      - name: Compare URLs
        run: |
          python3 compare/ci/k8s-ci.py docs check-removed-urls \
            --base-urls base/docs/canonicalk8s/urls.txt \
            --compare-urls compare/docs/canonicalk8s/urls.txt \
            --redirects compare/docs/canonicalk8s/redirects.txt