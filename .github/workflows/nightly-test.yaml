name: Nightly

# Deliberately not triggered by pull_request. Every job here targets a
# published snap channel or the go/candidate toolchain, so none of them cover a
# PR's own changes, and the channel sweep alone fans out into hundreds of jobs.
# The reusable workflows called here (e2e-tests, build-snap) are exercised on
# every PR by lint_and_integration.yaml. Use workflow_dispatch to test an edit.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Runs every midnight

permissions:
  contents: read
  actions: read

jobs:
  test-integration:
    name: Integration
    strategy:
      matrix:
        os: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
        arch: ["amd64", "arm64"]
        # TODO(ben): Automatically fetch all supported releases.
        channel:
          [
            "latest/edge",
            "1.37-classic/edge",
            "1.36-classic/edge",
            "1.35-classic/edge",
            "1.34-classic/edge",
            "1.33-classic/edge",
            "1.32-classic/edge",
          ]
      fail-fast: false
    uses: $/.github/workflows/e2e-tests.yaml
    with:
      arch: ${{ matrix.arch }}
      os: ${{ matrix.os }}
      channel: ${{ matrix.channel }}
      test-tags: "up_to_nightly"
      parallel: true
      # 3 os * 2 arch * 7 channel = 42 cells, capped by max-parallel below.
      max-parallel: 10
      upload-results: true

  build-snap-go-candidate:
    name: Build snap (Go candidate)
    uses: $/.github/workflows/build-snap.yaml
    with:
      arch: amd64
      go-snap-risk: candidate

  test-go-candidate-smoke:
    name: Go candidate smoke test
    needs: build-snap-go-candidate
    uses: $/.github/workflows/e2e-tests.yaml
    with:
      arch: amd64
      os: ubuntu:24.04
      # Smallest tag set, used as a lightweight smoke test.
      test-tags: "pull_request"
      artifact: ${{ needs.build-snap-go-candidate.outputs.snap-artifact }}
      parallel: true
      # upload-results stays false so these don't enter the aggregated report.

  test-performance:
    name: Run performance tests for ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      matrix:
        os: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
        arch: ["amd64", "arm64"]
      fail-fast: false
    uses: $/.github/workflows/compare-performance.yaml
    with:
      arch: ${{ matrix.arch }}
      os: ${{ matrix.os }}
      channel-1: latest/edge
      channel-2: 1.32-classic/stable

  collect-results:
    name: Collect integration test results
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    needs: [test-integration]
    steps:
      - name: Checkout artifact client lockfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: ci/artifact-client
      - name: Install @actions/artifact client
        run: |
          for attempt in 1 2 3; do
            if npm ci --prefix ci/artifact-client; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Failed to install @actions/artifact after 3 attempts" >&2
          exit 1
      - name: Download and aggregate results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { DefaultArtifactClient } = await import(
              `${process.env.GITHUB_WORKSPACE}/ci/artifact-client/node_modules/@actions/artifact/lib/artifact.js`
            );

            // List run artifacts via paginated REST (~26 requests for ~2,500 artifacts,
            // well below GITHUB_TOKEN's 1,000 req/hr limit; actions/download-artifact's
            // listArtifacts() caps at 1,000 and silently drops excess results).
            const allArtifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              }
            );

            // Keep only the latest non-expired artifact per logical test cell across
            // rerun attempts (e2e-tests.yaml appends a random -<uuid> to each name).
            const uuidSuffix =
              /-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
            const latestByCell = new Map();
            for (const artifact of allArtifacts) {
              if (artifact.expired || !artifact.name.startsWith('result-')) {
                continue;
              }
              const cellKey = artifact.name.replace(uuidSuffix, '');
              const prev = latestByCell.get(cellKey);
              if (!prev || artifact.id > prev.id) {
                latestByCell.set(cellKey, artifact);
              }
            }

            const targets = Array.from(latestByCell.values());
            core.info(
              `Found ${targets.length} deduplicated result-* artifacts (from ${allArtifacts.length} total run artifacts)`
            );

            // Download via DefaultArtifactClient without findBy: authenticates with
            // ACTIONS_RUNTIME_TOKEN against the internal Actions ResultsService and
            // blob storage SAS URLs, consuming zero GITHUB_TOKEN REST API requests.
            const artifactClient = new DefaultArtifactClient();
            const resultsDir = path.resolve('results');
            fs.mkdirSync(resultsDir, { recursive: true });

            const concurrency = 10;
            const resultsByTuple = new Map();
            for (let i = 0; i < targets.length; i += concurrency) {
              const batch = targets.slice(i, i + concurrency);
              const batchEntries = await Promise.all(
                batch.map(async (artifact) => {
                  const dest = path.join(resultsDir, String(artifact.id));
                  const outcome = await artifactClient.downloadArtifact(artifact.id, {
                    path: dest,
                    expectedHash: artifact.digest || undefined,
                  });
                  if (outcome.digestMismatch) {
                    throw new Error(
                      `Digest validation failed for artifact ${artifact.name} (ID ${artifact.id})`
                    );
                  }
                  const jsonPath = path.join(dest, 'result.json');
                  if (!fs.existsSync(jsonPath)) {
                    throw new Error(
                      `Missing result.json in downloaded artifact ${artifact.name} (ID ${artifact.id})`
                    );
                  }
                  const record = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
                  return { id: artifact.id, record };
                })
              );
              for (const entry of batchEntries) {
                const r = entry.record;
                const tupleKey = [
                  r.os,
                  r.arch,
                  r.channel,
                  r.artifact,
                  r.flavor,
                  r.substrate,
                  r.test,
                ].join('\0');
                const prev = resultsByTuple.get(tupleKey);
                const attemptNum = Number(r.attempt) || 0;
                const prevAttempt = prev ? Number(prev.record.attempt) || 0 : -1;
                if (
                  !prev ||
                  attemptNum > prevAttempt ||
                  (attemptNum === prevAttempt && entry.id > prev.id)
                ) {
                  resultsByTuple.set(tupleKey, entry);
                }
              }
            }

            const aggregated = Array.from(resultsByTuple.values(), (e) => e.record);
            fs.writeFileSync('aggregated-results.json', JSON.stringify(aggregated));
            core.info(`Wrote ${aggregated.length} results to aggregated-results.json`);
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aggregated-results
          path: aggregated-results.json

  Mattermost:
    name: Notify Mattermost
    # Notify on success or failure but only if the event is a scheduled run.
    # We don't want to ping people of failed PRs.
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [test-integration, test-performance, collect-results]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install tox
        uses: $/.github/actions/retry-command
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 5
          command: |
            sudo apt-get update
            sudo apt-get install -y tox
      - name: Download integration test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aggregated-results
      - name: Aggregate and post results
        working-directory: ci/
        shell: bash
        env:
          MATTERMOST_BOT_WEBHOOK_URL: ${{ secrets.MATTERMOST_BOT_WEBHOOK_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_SERVER: ${{ secrets.MATTERMOST_SERVER }}
          # Kubernetes CI Night's watch channel
          MATTERMOST_CHANNEL_ID: "4axiydhyxfr8px4phe9d5wgx7w"
        run: |
          tox -e k8s-ci -- mattermost results-message \
            --webhook $MATTERMOST_BOT_WEBHOOK_URL \
            --server $MATTERMOST_SERVER \
            --bot-token $MATTERMOST_BOT_TOKEN \
            --channel-id $MATTERMOST_CHANNEL_ID \
            --file ${{ github.workspace }}/aggregated-results.json \
            --title "k8s-snap Nightly CI Status - $(date +'%d/%m/%Y')"
