name: Docs Spread Tests

on:
  workflow_call:
    inputs:
      changed_files:
        description: "Space-delimited docs/canonicalk8s-relative file list from docs-checks prepare job"
        required: false
        type: string

permissions:
  contents: read

env:
  OPERATOR_WORKFLOWS_REF: df449f1e3d1b8babbe9df48bbebcff1e58c9fda9  # main as of 2026-05-07

jobs:
  prepare-docs-spread:
    runs-on: ubuntu-latest
    outputs:
      no_suites: ${{ steps.generate.outputs.no_suites }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout upstream spread script
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: canonical/operator-workflows
          ref: ${{ env.OPERATOR_WORKFLOWS_REF }}
          sparse-checkout: |
            spread/create_spread_task_file.py
          sparse-checkout-cone-mode: false
          path: workflow-scripts
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install pyyaml==6.0.2

      - id: generate
        name: Generate tasks.yaml for changed docs
        shell: bash
        env:
          CHANGED_FILES_INPUT: ${{ inputs.changed_files }}
        run: |
          set -euo pipefail

          rm -rf tests/spread_generated

          changed_files_input="${CHANGED_FILES_INPUT:-}"

          if [[ -z "$changed_files_input" ]]; then
            echo "no_suites=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi 
        
          # Pass 1: generate standalone task for each changed file.
          # build_spread_task.py handles skipping files with no marker or scenario_only.
          while IFS= read -r rel; do
            [[ -z "$rel" ]] && continue
            python3 docs/tools/build_spread_task.py --target "$rel"
          done < <(printf '%s\n' "$changed_files_input" | tr ' ' '\n' | grep -v '^$')

          # Pass 2: generate scenario chains for any triggered scenarios.
          python3 docs/tools/build_spread_task.py --detect-scenarios "$changed_files_input"

          # Determine if any tasks were generated.
          if find tests/spread_generated -name task.yaml -print -quit 2>/dev/null | grep -q .; then
            echo "no_suites=false" >> "$GITHUB_OUTPUT"
          else
            echo "No spread tasks generated."
            echo "no_suites=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated spread tasks
        if: steps.generate.outputs.no_suites != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spread_generated
          path: tests/spread_generated

  docs-spread-tests:
    needs: prepare-docs-spread
    if: needs.prepare-docs-spread.outputs.no_suites != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - snap_bootstrapped
          - snap_clean

    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download generated spread tasks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spread_generated
          path: tests/spread_generated

      - name: Recreate suite directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/spread_generated/{snap_clean,snap_bootstrapped}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23"

      - name: Install spread
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/canonical/spread/cmd/spread@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Skip empty suite
        id: suite-check
        shell: bash
        run: |
          set -euo pipefail
          suite_dir="tests/spread_generated/${{ matrix.suite }}"
          if [[ ! -d "$suite_dir" ]] || [[ -z "$(find "$suite_dir" -name task.yaml -print -quit)" ]]; then
            echo "Suite ${{ matrix.suite }} has no generated tasks; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run spread suite
        if: steps.suite-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo adduser --gecos "" --disabled-password ubuntu || true
          echo "ubuntu:ubuntu" | sudo chpasswd || true
          # Ensure all suite directories defined in spread.yaml exist so spread
          # does not fail its directory scan even when only one suite has tasks.
          mkdir -p tests/spread_generated/snap_clean tests/spread_generated/snap_bootstrapped
          cd docs
          spread -vv -repeat 0 "github-ci:ubuntu-24.04-64:tests/spread_generated/${{ matrix.suite }}/"