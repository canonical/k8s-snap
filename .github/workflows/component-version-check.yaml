name: Check Component Version Changes on Release branches

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
    - 'release-*'

permissions: {}

jobs:
  validation-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      # Checkout the PR branch
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Fetch all labels on the PR
      - name: Get PR labels
        id: labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const labelNames = pr.data.labels.map(l => l.name);
            return labelNames.join(',');
          result-encoding: string

      # Skip the diff validation if override label is present
      - name: Skip if override label present
        if: contains(steps.labels.outputs.result, 'skip-component-version-check')
        run: |
          echo "✅ skip-component-version-check label detected, skipping validation"
          exit 0

      # Get the diff for this PR
      - name: Get PR diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF"
          git diff "origin/$BASE_REF"...HEAD > pr.diff

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - run: pip3 install --require-hashes -r ci/requirements-release.txt

      # Validate the diff
      - name: Validate diff
        id: validate
        run: |
          stderr_file=$(mktemp)

          if python3 ./build-scripts/hack/check-component-versions.py pr.diff 2>"$stderr_file"; then
            echo "invalid=false" >> $GITHUB_OUTPUT
            echo "stderr=" >> $GITHUB_OUTPUT
          else
            echo "Found invalid change in diff"
            echo "invalid=true" >> $GITHUB_OUTPUT
            echo "stderr=$(cat $stderr_file)" >> $GITHUB_OUTPUT
          fi

      # Comment on the PR if invalid
      - name: Comment on PR if invalid
        if: steps.validate.outputs.invalid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          VALIDATION_STDERR: ${{ steps.validate.outputs.stderr }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$REPO" \
            --body-file - <<EOF
          ❌ Invalid change detected in PR diff. Please remove it.
          Label this PR with 'skip-component-version-check' to ignore

          $VALIDATION_STDERR
          EOF

      # Fail the job if invalid
      - name: Fail job if invalid
        if: steps.validate.outputs.invalid == 'true'
        run: exit 1
