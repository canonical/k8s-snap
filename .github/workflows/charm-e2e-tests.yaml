name: Charm e2e tests

permissions:
  contents: read # for actions/checkout to fetch code
  actions: read # for gh run download to fetch artifacts

on:
  workflow_call:
    inputs:
      arch:
        description: Job runner architecture (amd64 or arm64)
        default: amd64
        type: string
      # Download k8s-snap using either a GH action artifact or a snap channel.
      artifact:
        description: The name of a GH action artifact.
        type: string
      channel:
        description: k8s snap channel.
        type: string
      charm-channel:
        description: k8s charm channel.
        type: string
        default: latest/edge

jobs:
  charm-e2e-tests:
    name: Test ${{ inputs.arch }} ${{ inputs.artifact }}
    runs-on: ${{ inputs.arch == 'arm64' && 'self-hosted-linux-arm64-jammy-large' || 'self-hosted-linux-amd64-jammy-xlarge' }}
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Download k8s-snap
        id: download-snap
        uses: ./.github/actions/download-k8s-snap
        with:
          channel: ${{ inputs.channel }}
          artifact: ${{ inputs.artifact }}
      - name: Setup LXD
        id: setup-lxd
        continue-on-error: true
        timeout-minutes: 10
        uses: canonical/setup-lxd@a3c85fc6fb7fff43fcfeae87659e41a8f635b7dd # v0.1.3
      - name: Cleanup LXD after failure
        if: steps.setup-lxd.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo systemctl stop snapd.service snapd.socket || true
          sudo systemctl start snapd.socket snapd.service || true
          for id in $(snap changes 2>/dev/null | awk '/^[0-9]+/ {if ($2 == "Doing" || $2 == "Do" || $2 == "Undoing") print $1}'); do
            echo "Aborting in-flight snap change $id..."
            sudo snap abort "$id" || true
          done
          echo "Waiting for in-flight snap changes to settle..."
          for i in $(seq 1 36); do
            changes=$(snap changes 2>/dev/null | awk '/^[0-9]+/ {if ($2 == "Doing" || $2 == "Do" || $2 == "Undoing") print $1, $2}')
            if [ -z "$changes" ]; then
              echo "All snap changes settled."
              break
            fi
            echo "Still in progress ($i/36): $changes"
            sleep 5
          done
          snap changes || true
      - name: Retry Setup LXD
        if: steps.setup-lxd.outcome == 'failure'
        timeout-minutes: 10
        uses: canonical/setup-lxd@a3c85fc6fb7fff43fcfeae87659e41a8f635b7dd # v0.1.3
      - name: Install virtualenv
        run: sudo apt install -y python3.10-venv
      - name: Generate snap tarball
        run: |
          mkdir snap_installation
          mv ${{ steps.download-snap.outputs.snap-path }} snap_installation/k8s.snap
          tar cvzf snap_installation.tar.gz -C snap_installation/ .
      - name: Setup Astral UV
        uses: astral-sh/setup-uv@7edac99f961f18b581bbd960d59d049f04c0002f # v6.4.1
        with:
          python-version: ${{ env.python-version }}
      - name: Install tox with UV
        run: uv tool install tox --with tox-uv
      - name: Install charmcraft
        run: |
          sudo snap install charmcraft --classic
      - name: Install juju
        run: |
          sudo snap install juju --classic
      - name: Download charms ${{ inputs.charm-channel }} ${{ inputs.arch }}
        run: |
          # The operator tests expect the charm file name to have the
          # ${charmName}_ prefix and include the arch and ubuntu base.
          # https://github.com/canonical/k8s-operator/blob/eba756ddc723e9aa5242c7804712807495356c6f/tests/integration/helpers.py#L334-L342

          # The charm base (e.g. ubuntu@22.04) must match the one used by other
          # related charms (e.g. ceph) used by the k8s-operator tests.
          arch=${{ inputs.arch }}
          k8sCharmFile=${GITHUB_WORKSPACE}/k8s_ubuntu-22.04-${arch}.charm
          k8sWorkerChamFile=${GITHUB_WORKSPACE}/k8s-worker_ubuntu-22.04-${arch}.charm

          juju download k8s \
            --channel ${{ inputs.charm-channel }} \
            --filepath $k8sCharmFile \
            --base ubuntu@22.04
          juju download k8s-worker \
            --channel ${{ inputs.charm-channel }} \
            --filepath $k8sWorkerChamFile \
            --base ubuntu@22.04
      - name: Bootstrap Juju controller (lxd)
        timeout-minutes: 50
        run: |
          pre_containers=$(mktemp)
          lxc list -c n --format csv > "$pre_containers"

          cleanup() {
            timeout 1m juju kill-controller -y -t 30s lxd 2>/dev/null || true
            timeout 15s juju unregister -y lxd 2>/dev/null || true
            if [ -f "$pre_containers" ]; then
              comm -23 <(timeout 15s lxc list -c n --format csv 2>/dev/null | sort) <(sort "$pre_containers") | grep -E '^juju-' | xargs -r -n 1 timeout 30s lxc delete -f 2>/dev/null || true
            fi
          }

          # Retry once after cleaning lingering controller state if bootstrap hangs.
          ret=0
          timeout -k 10s 20m juju bootstrap localhost lxd --debug || ret=$?
          if [ "$ret" -ne 0 ]; then
            echo "Bootstrap failed or timed out; retrying after cleanup..."
            cleanup
            ret=0
            timeout -k 10s 20m juju bootstrap localhost lxd --debug || ret=$?
            if [ "$ret" -ne 0 ]; then
              cleanup
              rm -f "$pre_containers"
              exit "$ret"
            fi
          fi
          rm -f "$pre_containers"
      - name: Resolve k8s-operator ref
        id: operator-ref
        env:
          CANDIDATE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          candidate="${CANDIDATE_REF#refs/heads/}"
          operator_repo="https://github.com/canonical/k8s-operator.git"

          ref_exists() {
            local ret=0
            for _ in 1 2 3; do
              ret=0
              git ls-remote --exit-code "$operator_repo" "refs/heads/$1" >/dev/null 2>&1 || ret=$?
              if [ "$ret" -eq 0 ]; then
                return 0
              elif [ "$ret" -eq 2 ]; then
                return 1
              fi
              sleep 2
            done
            return 1
          }

          target=""
          if [ -n "$candidate" ] && ref_exists "$candidate"; then
            target="$candidate"
          fi

          if [ -z "$target" ] && [ -n "$candidate" ]; then
            if [[ "$candidate" =~ (release-[0-9]+\.[0-9]+) ]]; then
              rel="${BASH_REMATCH[1]}"
              if ref_exists "$rel"; then
                target="$rel"
              fi
            elif [[ "$candidate" =~ ([0-9]+\.[0-9]+) ]]; then
              rel="release-${BASH_REMATCH[1]}"
              if ref_exists "$rel"; then
                target="$rel"
              fi
            fi
          fi

          if [ -z "$target" ] && [ -f "build-scripts/components/kubernetes/version" ]; then
            k8s_ver=$(cat "build-scripts/components/kubernetes/version")
            if [[ "$k8s_ver" =~ ([0-9]+\.[0-9]+) ]]; then
              rel="release-${BASH_REMATCH[1]}"
              if ref_exists "$rel"; then
                target="$rel"
              fi
            fi
          fi

          if [ -z "$target" ]; then
            target="main"
          fi

          echo "Resolved k8s-operator ref: $target"
          echo "ref=$target" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: canonical/k8s-operator
          ref: ${{ steps.operator-ref.outputs.ref }}
          path: k8s-operator
      - name: Disable lxd ipv6
        run: |
          # The charm tests can't handle ipv6 dualstack.
          lxc network set lxdbr0 ipv6.address none
      - name: Run e2e tests
        run: |
          set -x

          arch=${{ inputs.arch }}
          k8sCharmFile=${GITHUB_WORKSPACE}/k8s_ubuntu-22.04-${arch}.charm
          k8sWorkerChamFile=${GITHUB_WORKSPACE}/k8s-worker_ubuntu-22.04-${arch}.charm
          snapInstallRes=${GITHUB_WORKSPACE}/snap_installation.tar.gz

          ls -lh $charmFile
          ls -lh $snapInstallRes

          cd k8s-operator

          tox -r -e integration \
            -- \
            --charm-file $k8sCharmFile \
            --charm-file $k8sWorkerChamFile \
            --snap-installation-resource $snapInstallRes \
            'tests/integration/test_k8s.py::test_nodes_ready'
