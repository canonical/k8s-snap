name: Charm e2e tests

permissions:
  contents: read # for actions/checkout to fetch code
  actions: read # for gh run download to fetch artifacts

on:
  workflow_call:
    inputs:
      arch:
        description: Job runner architecture (amd64 or arm64)
        default: amd64
        type: string
      # Download k8s-snap using either a GH action artifact or a snap channel.
      artifact:
        description: The name of a GH action artifact.
        type: string
      attempt:
        description: Matrix attempt identifier
        default: '1'
        type: string
      channel:
        description: k8s snap channel.
        type: string
      charm-channel:
        description: k8s charm channel.
        type: string
        default: latest/edge
    secrets:
      CHARMCRAFT_AUTH:
        description: Charmcraft authentication token
        required: false

jobs:
  check-charm-channel:
    name: Check if charm channel is available
    runs-on: ubuntu-latest
    outputs:
      channel-available: ${{ steps.check-channel.outputs.channel-available }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Setup Astral UV
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install tox with UV
        run: uv tool install tox --with tox-uv
      - name: Check charm channel availability
        id: check-channel
        working-directory: ci
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
          INPUT_CHARM_CHANNEL: ${{ inputs.charm-channel }}
        run: |
          if tox -e k8s-ci -- charm channel-available "$INPUT_CHARM_CHANNEL"; then
            echo "channel-available=true" >> $GITHUB_OUTPUT
          else
            echo "channel-available=false" >> $GITHUB_OUTPUT
          fi

  charm-e2e-tests:
    name: Test ${{ inputs.arch }}
    needs: check-charm-channel
    if: needs.check-charm-channel.outputs.channel-available == 'true'
    runs-on: ${{ inputs.arch == 'arm64' && 'self-hosted-linux-arm64-jammy-large' || 'self-hosted-linux-amd64-jammy-xlarge' }}
    env:
      K8S_OPERATOR: k8s-operator
    timeout-minutes: 600
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'
      - name: Download k8s-snap
        id: download-snap
        uses: $/.github/actions/download-k8s-snap
        with:
          channel: ${{ inputs.channel }}
          artifact: ${{ inputs.artifact }}
      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
      - name: Install virtualenv
        run: sudo apt install -y python3.10-venv
      - name: Generate snap tarball
        env:
          SNAP_PATH: ${{ steps.download-snap.outputs.snap-path }}
        run: |
          mkdir snap_installation
          mv "$SNAP_PATH" snap_installation/k8s.snap
          tar cvzf snap_installation.tar.gz -C snap_installation/ .
      - name: Setup Astral UV
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ env.python-version }}
      - name: Install tox with UV
        run: uv tool install tox --with tox-uv
      - name: Install charmcraft, juju, juju-crashdump
        uses: $/.github/actions/retry-command
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 5
          command: |
            sudo snap install charmcraft --classic
            sudo snap install juju --channel=3/stable --classic
            sudo snap install juju-crashdump --classic
      - name: Download charms ${{ inputs.charm-channel }} ${{ inputs.arch }}
        uses: $/.github/actions/retry-command
        env:
          INPUT_ARCH: ${{ inputs.arch }}
          INPUT_CHARM_CHANNEL: ${{ inputs.charm-channel }}
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 10
          command: |
            # The operator tests expect the charm file name to have the
            # ${charmName}_ prefix and include the arch and ubuntu base.
            # https://github.com/canonical/k8s-operator/blob/eba756ddc723e9aa5242c7804712807495356c6f/tests/integration/helpers.py#L334-L342
            # The charm base (ubuntu@24.04) must match `series: noble` in
            # k8s-operator's test-smoke.yaml bundle; otherwise bundle.py ignores
            # the downloaded charm file and falls back to `charmcraft pack`.
            arch="$INPUT_ARCH"
            k8sCharmFile="${GITHUB_WORKSPACE}/k8s_ubuntu-24.04-${arch}.charm"
            k8sWorkerCharmFile="${GITHUB_WORKSPACE}/k8s-worker_ubuntu-24.04-${arch}.charm"
            rm -f "$k8sCharmFile" "$k8sWorkerCharmFile"
            juju download k8s \
              --channel "$INPUT_CHARM_CHANNEL" \
              --filepath "$k8sCharmFile" \
              --base ubuntu@24.04
            juju download k8s-worker \
              --channel "$INPUT_CHARM_CHANNEL" \
              --filepath "$k8sWorkerCharmFile" \
              --base ubuntu@24.04
      - name: Check system resources
        run: |
          # checking memory and cpu info to help debug CI failures
          echo "--- Runner Host CPU Capacity ---"
          echo "Total logical cores on the host:"
          nproc --all 

          echo "--- Runner Host Memory Capacity (GB) ---"
          echo "Total physical RAM on the host:"
          free -g
      - name: Bootstrap Juju controller (lxd)
        timeout-minutes: 50
        run: |
          pre_containers=$(mktemp)
          lxc list -c n --format csv > "$pre_containers"

          diag_dir="${GITHUB_WORKSPACE}/bootstrap-diag"
          mkdir -p "$diag_dir"

          dump_diag() {
            local label="${1:-periodic}"
            local ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            local out="$diag_dir/diag-${ts}-${label}.txt"
            {
              echo "============================================================"
              echo "=== DIAG DUMP [$label] at $ts ==="
              echo "============================================================"
              echo "--- [HOST] lxc list ---"
              timeout 10s lxc list || true
              echo "--- [HOST] ip -6 route ---"
              timeout 10s ip -6 route || true
              echo "--- [HOST] resolvectl status ---"
              timeout 10s resolvectl status || true
              echo "--- [HOST] snap changes ---"
              timeout 10s snap changes || true
              echo "--- [HOST] ps aux | grep -E 'apt|snap|juju|mongo' ---"
              timeout 10s ps aux | grep -E 'apt|snap|juju|mongo' || true

              local ctrl
              ctrl=$(timeout 10s lxc list -c n --format csv 2>/dev/null | grep -E '^juju-' | head -n 1)
              if [ -n "$ctrl" ]; then
                echo "--- [CONTAINER: $ctrl] cloud-init status --long ---"
                timeout 15s lxc exec "$ctrl" -- cloud-init status --long || true
                echo "--- [CONTAINER: $ctrl] tail -n 50 /var/log/cloud-init-output.log ---"
                timeout 15s lxc exec "$ctrl" -- tail -n 50 /var/log/cloud-init-output.log || true
                echo "--- [CONTAINER: $ctrl] ps aux | grep -E 'apt|snap|juju|mongo' ---"
                timeout 15s lxc exec "$ctrl" -- ps aux | grep -E 'apt|snap|juju|mongo' || true
                echo "--- [CONTAINER: $ctrl] snap changes ---"
                timeout 15s lxc exec "$ctrl" -- snap changes || true
                echo "--- [CONTAINER: $ctrl] ip -6 route ---"
                timeout 15s lxc exec "$ctrl" -- ip -6 route || true
                echo "--- [CONTAINER: $ctrl] resolvectl status ---"
                timeout 15s lxc exec "$ctrl" -- resolvectl status || true
                echo "--- [CONTAINER: $ctrl] tail -n 50 /var/log/cloud-init.log ---"
                timeout 15s lxc exec "$ctrl" -- tail -n 50 /var/log/cloud-init.log || true
                echo "--- [CONTAINER: $ctrl] tail -n 50 /var/log/juju/machine-0.log ---"
                timeout 15s lxc exec "$ctrl" -- tail -n 50 /var/log/juju/machine-0.log 2>/dev/null || true
              else
                echo "--- [CONTAINER] No juju container found yet ---"
              fi
            } > "$out" 2>&1
            cat "$out"
          }

          (
            while true; do
              sleep 60
              dump_diag "periodic"
            done
          ) &
          diag_pid=$!

          cleanup() {
            dump_diag "pre-cleanup"
            timeout 1m juju kill-controller -y -t 30s lxd 2>/dev/null || true
            timeout 15s juju unregister -y lxd 2>/dev/null || true
            if [ -f "$pre_containers" ]; then
              comm -23 <(timeout 15s lxc list -c n --format csv 2>/dev/null | sort) <(sort "$pre_containers") | grep -E '^juju-' | xargs -r -n 1 timeout 30s lxc delete -f 2>/dev/null || true
            fi
          }

          ret=0
          timeout -k 10s 20m juju bootstrap localhost lxd --debug || ret=$?
          if [ "$ret" -ne 0 ]; then
            echo "Bootstrap failed or timed out (exit code $ret); retrying after cleanup..."
            cleanup
            ret=0
            timeout -k 10s 20m juju bootstrap localhost lxd --debug || ret=$?
            if [ "$ret" -ne 0 ]; then
              cleanup
              kill "$diag_pid" 2>/dev/null || true
              rm -f "$pre_containers"
              exit "$ret"
            fi
          fi
          kill "$diag_pid" 2>/dev/null || true
          dump_diag "post-bootstrap"
          rm -f "$pre_containers"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: canonical/k8s-operator
          ref: ${{ github.base_ref || github.ref_name }}
          path: ${{ env.K8S_OPERATOR }}
      - name: Disable lxd ipv6
        run: |
          # The charm tests can't handle ipv6 dualstack.
          lxc network set lxdbr0 ipv6.address none
      - name: Run e2e tests
        env:
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          echo "Bootstrap completed successfully! Skipping long integration tests in diagnostic workflow."
      - name: Collect Juju Status
        if: failure()
        id: collect-juju-status
        run: |
          set -x
          path="${K8S_OPERATOR}/tmp"
          mkdir -p "$path"
          echo "path=${path}/" >> "$GITHUB_OUTPUT"
          if command -v juju >/dev/null 2>&1; then
            juju status 2>&1 | tee "$path/juju-status.txt" || true
          fi
          if command -v juju-crashdump >/dev/null 2>&1; then
            juju-crashdump -s -m controller -a debug-layer -a config -o "$path/" || true
            mv "${K8S_OPERATOR}"/juju-crashdump-* "$path/" || true
          fi
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: charm-e2e-tests-${{ inputs.arch }}
          path: ${{ steps.collect-juju-status.outputs.path }}
          if-no-files-found: ignore
      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.4.3
        with:
          name: bootstrap-diag-attempt-${{ inputs.attempt }}
          path: ${{ github.workspace }}/bootstrap-diag
          if-no-files-found: ignore
