name: Charm e2e tests

permissions:
  contents: read # for actions/checkout to fetch code
  actions: read # for gh run download to fetch artifacts

on:
  workflow_call:
    inputs:
      arch:
        description: Job runner architecture (amd64 or arm64)
        default: amd64
        type: string
      # Download k8s-snap using either a GH action artifact or a snap channel.
      artifact:
        description: The name of a GH action artifact.
        type: string
      channel:
        description: k8s snap channel.
        type: string
      charm-channel:
        description: k8s charm channel.
        type: string
        default: latest/edge
    secrets:
      CHARMCRAFT_AUTH:
        description: Charmcraft authentication token
        required: false

jobs:
  check-charm-channel:
    name: Check if charm channel is available
    runs-on: ubuntu-latest
    outputs:
      channel-available: ${{ steps.check-channel.outputs.channel-available }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Setup Astral UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install tox with UV
        run: uv tool install tox --with tox-uv
      - name: Check charm channel availability
        id: check-channel
        working-directory: ci
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
          INPUT_CHARM_CHANNEL: ${{ inputs.charm-channel }}
        run: |
          if tox -e k8s-ci -- charm channel-available "$INPUT_CHARM_CHANNEL"; then
            echo "channel-available=true" >> $GITHUB_OUTPUT
          else
            echo "channel-available=false" >> $GITHUB_OUTPUT
          fi

  charm-e2e-tests:
    name: Test ${{ inputs.arch }}
    needs: check-charm-channel
    if: needs.check-charm-channel.outputs.channel-available == 'true'
    runs-on: ${{ inputs.arch == 'arm64' && 'self-hosted-linux-arm64-jammy-large' || 'self-hosted-linux-amd64-jammy-xlarge' }}
    env:
      K8S_OPERATOR: k8s-operator
    timeout-minutes: 600
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'
      - name: Download k8s-snap
        id: download-snap
        uses: $/.github/actions/download-k8s-snap
        with:
          channel: ${{ inputs.channel }}
          artifact: ${{ inputs.artifact }}
      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
      - name: Install virtualenv
        run: sudo apt install -y python3.10-venv
      - name: Generate snap tarball
        env:
          SNAP_PATH: ${{ steps.download-snap.outputs.snap-path }}
        run: |
          mkdir snap_installation
          mv "$SNAP_PATH" snap_installation/k8s.snap
          tar cvzf snap_installation.tar.gz -C snap_installation/ .
      - name: Setup Astral UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.python-version }}
      - name: Install tox with UV
        run: uv tool install tox --with tox-uv
      - name: Install charmcraft, juju, juju-crashdump
        uses: $/.github/actions/retry-command
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 5
          command: |
            sudo snap install charmcraft --classic
            sudo snap install juju --channel=3/stable --classic
            sudo snap install juju-crashdump --classic
      - name: Download charms ${{ inputs.charm-channel }} ${{ inputs.arch }}
        uses: $/.github/actions/retry-command
        env:
          INPUT_ARCH: ${{ inputs.arch }}
          INPUT_CHARM_CHANNEL: ${{ inputs.charm-channel }}
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 10
          command: |
            # The operator tests expect the charm file name to have the
            # ${charmName}_ prefix and include the arch and ubuntu base.
            # https://github.com/canonical/k8s-operator/blob/eba756ddc723e9aa5242c7804712807495356c6f/tests/integration/helpers.py#L334-L342
            # The charm base (ubuntu@24.04) must match `series: noble` in
            # k8s-operator's test-smoke.yaml bundle; otherwise bundle.py ignores
            # the downloaded charm file and falls back to `charmcraft pack`.
            arch="$INPUT_ARCH"
            k8sCharmFile="${GITHUB_WORKSPACE}/k8s_ubuntu-24.04-${arch}.charm"
            k8sWorkerCharmFile="${GITHUB_WORKSPACE}/k8s-worker_ubuntu-24.04-${arch}.charm"
            rm -f "$k8sCharmFile" "$k8sWorkerCharmFile"
            juju download k8s \
              --channel "$INPUT_CHARM_CHANNEL" \
              --filepath "$k8sCharmFile" \
              --base ubuntu@24.04
            juju download k8s-worker \
              --channel "$INPUT_CHARM_CHANNEL" \
              --filepath "$k8sWorkerCharmFile" \
              --base ubuntu@24.04
      - name: Check system resources
        run: |
          # checking memory and cpu info to help debug CI failures
          echo "--- Runner Host CPU Capacity ---"
          echo "Total logical cores on the host:"
          nproc --all 

          echo "--- Runner Host Memory Capacity (GB) ---"
          echo "Total physical RAM on the host:"
          free -g
      - name: Bootstrap Juju controller (lxd)
        run: |
          juju bootstrap localhost lxd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: canonical/k8s-operator
          ref: ${{ github.base_ref || github.ref_name }}
          path: ${{ env.K8S_OPERATOR }}
      - name: Disable lxd ipv6
        run: |
          # The charm tests can't handle ipv6 dualstack.
          lxc network set lxdbr0 ipv6.address none
      - name: Run e2e tests
        env:
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          set -x
          arch=$INPUT_ARCH
          k8sCharmFile=${GITHUB_WORKSPACE}/k8s_ubuntu-24.04-${arch}.charm
          k8sWorkerCharmFile=${GITHUB_WORKSPACE}/k8s-worker_ubuntu-24.04-${arch}.charm
          snapInstallRes=${GITHUB_WORKSPACE}/snap_installation.tar.gz
          ls -lh $k8sCharmFile
          ls -lh $snapInstallRes
          cd ${{ env.K8S_OPERATOR }}
          # Only run the smoke tests from k8s-operator.
          tox -r -e integration \
            -- \
            --charm-file $k8sCharmFile \
            --charm-file $k8sWorkerCharmFile \
            --snap-installation-resource $snapInstallRes \
            --arch "$INPUT_ARCH" \
            -k "test_smoke"
      - name: Collect Juju Status
        if: failure()
        id: collect-juju-status
        run: |
          set -x
          path="${K8S_OPERATOR}/tmp"
          mkdir -p "$path"
          echo "path=${path}/" >> "$GITHUB_OUTPUT"
          if command -v juju >/dev/null 2>&1; then
            juju status 2>&1 | tee "$path/juju-status.txt" || true
          fi
          if command -v juju-crashdump >/dev/null 2>&1; then
            juju-crashdump -s -m controller -a debug-layer -a config -o "$path/" || true
            mv "${K8S_OPERATOR}"/juju-crashdump-* "$path/" || true
          fi
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: charm-e2e-tests-${{ inputs.arch }}
          path: ${{ steps.collect-juju-status.outputs.path }}
          if-no-files-found: ignore
