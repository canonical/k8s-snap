name: Lint and integration

on:
  push:
    paths-ignore:
      - 'docs/**'
    branches:
      - main
      - autoupdate/strict
      - 'autoupdate/v*'
      - 'release-[0-9]+.[0-9]+'
      - 'autoupdate/release-[0-9]+.[0-9]+-strict'

  pull_request:
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

jobs:
  build-snap:
    name: Build k8s-snap ${{ matrix.patch }} ${{ matrix.arch }}
    uses: ./.github/workflows/build-snap.yaml
    strategy:
      matrix:
        # e.g. strict - right now we only support the classic flavor
        patch: [""]
        arch: ["amd64", "arm64"]
    with:
      flavor: ${{ matrix.patch }}
      arch: ${{ matrix.arch }}

  test-branches:
    name: Test Branch Management
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.8'
      - name: Install tox
        run: sudo apt-get install -y tox
      - name: Extract Kubernetes versions
        id: versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          OLD_VERSION=$(git show "$BASE_SHA":build-scripts/components/kubernetes/version)
          NEW_VERSION=$(cat build-scripts/components/kubernetes/version)

          echo "Old Kubernetes version (base): $OLD_VERSION"
          echo "New Kubernetes version (PR):   $NEW_VERSION"

          OLD_MINOR=$(echo $OLD_VERSION | cut -d. -f2)
          NEW_MINOR=$(echo $NEW_VERSION | cut -d. -f2)

          echo "Old Kubernetes minor version (base): $OLD_MINOR"
          echo "New Kubernetes minor version (PR):   $NEW_MINOR"

          # Only run the branch_management tests if the minor version is the same
          if [ "$OLD_MINOR" = "$NEW_MINOR" ]; then
            echo "kubernetes_minor_same=true" >> $GITHUB_ENV
          else
            echo "kubernetes_minor_same=false" >> $GITHUB_ENV
          fi

      - name: Run branch_management tests
        if: env.kubernetes_minor_same == 'true'
        run: |
          tox -c tests/branch_management -e test
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install tox
        run: sudo apt-get install -y tox
      - name: Lint
        run: |
          cd tests/integration && tox -e lint
          cd ../../ci && tox -e lint
      - name: Bandit security scan
        run: |
          pip install --require-hashes -r ci/requirements-bandit.txt
          cd tests/integration && tox -e bandit
          cd ../../ci && tox -e bandit
          cd ..
          bandit -r build-scripts/ docs/tools/ -c pyproject.toml -lll

  # The bot's Python lives in canonical/k8s-ai-agent-toolkit and is tested
  # there. What this repository owns is the cluster helper, the workflow and
  # action, and the config that drives them -- so that is what this validates.
  triage-bot-assets:
    name: Triage bot assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        # setup-python provides a clean interpreter, so the runner image's
        # system PyYAML is not on the path here.
        run: pip install pyyaml==6.0.2
      - name: Check hack/cluster-up.sh syntax
        run: bash -n hack/cluster-up.sh
      - name: Check triage YAML parses
        run: |
          python3 - <<'EOF'
          import sys, yaml
          for path in (
              ".github/workflows/triage.yaml",
              ".github/actions/setup-triage-toolkit/action.yml",
              ".triage-config.yaml",
          ):
              with open(path) as handle:
                  yaml.safe_load(handle)
              print(f"ok {path}")
          EOF
      - name: Check protected-path patterns compile
        run: |
          python3 - <<'EOF'
          import re, sys, yaml
          with open(".triage-config.yaml") as handle:
              config = yaml.safe_load(handle)
          patterns = config.get("protected_paths_regex") or []
          if not patterns:
              sys.exit("no protected_paths_regex: the write guard would allow everything")
          compiled = []
          for pattern in patterns:
              try:
                  compiled.append(re.compile(pattern))
              except re.error as exc:
                  sys.exit(f"invalid protected path regex {pattern!r}: {exc}")
          # An unparseable or over-narrow policy fails open, which is the one
          # outcome that must never ship: assert the guard still refuses the
          # paths it exists for, and still permits the test files the bot
          # has to write to do its job at all.
          must_block = [
              ".github/workflows/triage.yaml",
              ".triage-config.yaml",
              ".agents/skills/triage/fix.md",
              "hack/cluster-up.sh",
              "AGENTS.md",
              "tests/integration/AGENTS.md",
              "tests/integration/lxd-profile.yaml",
              "tests/integration/tests/test_util/harness/base.py",
              "ci/triage.py",
              "build-scripts/components/k8sd/version",
              "snap/snapcraft.yaml",
          ]
          must_allow = [
              "tests/integration/tests/test_dns.py",
              "k8s/lib.sh",
              "docs/canonicalk8s/index.md",
          ]
          failures = []
          for path in must_block:
              if not any(p.search(path) for p in compiled):
                  failures.append(f"must be protected but is writable: {path}")
          for path in must_allow:
              if any(p.search(path) for p in compiled):
                  failures.append(f"must stay writable but is protected: {path}")
          if failures:
              sys.exit("\n".join(failures))
          print(f"{len(compiled)} patterns compile; policy holds")
          EOF
  get-e2e-tags:
    name: Get e2e test tags
    runs-on: ubuntu-latest
    outputs:
      test-tags: ${{ steps.get-e2e-tags.outputs.test-tags }}
    needs: [build-snap, python-lint]
    steps:
      - name: Checking out repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
      - name: Get e2e test tags
        id: get-e2e-tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          tags="pull_request"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Run all tests if there are test changes. In case of a PR, we'll
            # get a merge commit that includes all changes.
            if git diff HEAD HEAD~1 --name-only | grep "tests/"; then
              tags="up_to_weekly"
            fi
            # Run all tests if there are any changes to the Kubernetes components / features.
            if git diff HEAD HEAD~1 --name-only | grep "k8sd/features/.*/"; then
              tags="up_to_weekly"
            fi
            # Run all tests on backports.
            if echo "$BASE_REF" | grep "release-"; then
              tags="up_to_weekly"
            fi
          fi
          echo "test-tags=$tags" >> "$GITHUB_OUTPUT"
  test-integration:
    name: Integration
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    needs: [build-snap, get-e2e-tags, python-lint]
    uses: ./.github/workflows/e2e-tests.yaml
    with:
      arch: ${{ matrix.arch }}
      os: ubuntu:24.04
      test-tags: ${{ needs.get-e2e-tags.outputs.test-tags }}
      artifact: k8s-${{ matrix.arch }}.snap
      test-collection-repo: ${{github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
      test-collection-branch: ${{ github.head_ref }}
      parallel: true
  run-testflinger-tests:
    name: GPU Operator (Testflinger) - ${{ matrix.arch }}
    runs-on: self-hosted-linux-amd64-noble-private-endpoint-small
    needs: build-snap
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            job-file: ci/testflinger-jobs/gpu-operator-test-amd64.yaml
          - arch: arm64
            job-file: ci/testflinger-jobs/gpu-operator-test-arm64.yaml
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Download k8s snap
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: k8s-${{ matrix.arch }}.snap
          path: ${{ github.workspace }}
      - name: Archive test suite
        run: |
          tar czf k8s-test-suite.tar.gz tests/integration/
      - name: Submit Testflinger Job
        uses: canonical/testflinger/.github/actions/submit@2bef06ce0d029ad4c36d937c09ec096062b5c589 #main
        timeout-minutes: 75
        with:
          poll: true
          job-path: ${{ matrix.job-file }}
          attachments-relative-to: .
          client-id: ${{ secrets.TESTFLINGER_USERNAME }}
          secret-key: ${{ secrets.TESTFLINGER_PASSWORD }}
  security-scan:
    name: Security scan
    needs: build-snap
    uses: ./.github/workflows/security-scan.yaml
    with:
      artifact: ${{ needs.build-snap.outputs.snap-artifact }}
    permissions:
      contents: read # for actions/checkout to fetch code
      # security-events: write is required for github/codeql-action/upload-sarif to upload SARIF results
      # This permission is necessary for security scanning functionality and cannot be reduced.
      security-events: write

  get-charm-channel:
    name: Determine the charm channel
    outputs:
      charm-channel: ${{ steps.parse-branch.outputs.charm-channel }}
    runs-on: ubuntu-latest
    steps:
      - name: Parse branch name
        id: parse-branch
        env:
          # Use either the base (destination) branch name for PRs or
          # "ref_name" on push.
          BRANCH_NAME: ${{ github.base_ref || github.ref_name }}
        run: |
          release=$(echo $BRANCH_NAME | grep -Po "release-\d+\.\d+" | cut -d "-" -f 2)
          if [[ -n $release ]]; then
            # Stable releases don't have an "edge" track, we'll use beta.
            channel="$release/beta"
          else
            channel=latest/edge
          fi
          echo "charm-channel=$channel" >> "$GITHUB_OUTPUT"
  charm-e2e-tests:
    name: Charm e2e tests - ${{ matrix.arch }}
    strategy:
      matrix:
        arch: [amd64]
      fail-fast: false
    needs: [build-snap, python-lint, get-charm-channel]
    uses: ./.github/workflows/charm-e2e-tests.yaml
    secrets:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
    with:
      arch: ${{ matrix.arch }}
      artifact: k8s-${{ matrix.arch }}.snap
      charm-channel: ${{ needs.get-charm-channel.outputs.charm-channel }}
