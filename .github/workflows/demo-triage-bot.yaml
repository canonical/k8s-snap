#
# LIVE DEMO -- exercises the real triage bot end to end (real labels, real
# comments, and for the bug issue a genuine reproduce -> test -> fix ->
# draft PR run) against a fixed set of purpose-made issues so PR reviewers
# can see genuine bot behaviour without waiting for a real webhook event.
# Every issue it targets carries the `demo-triage-bot-test` label and says
# so in its body -- see #2699-#2703.
#
# Manual dispatch only, deliberately: ``route()`` treats every dispatched
# ``opened`` action as a fresh triage regardless of the issue's current
# label, so firing this on every push would re-classify and re-comment on
# the same issues repeatedly instead of giving one clean, real run to look
# at.
#
# Delete this workflow (and those issues) before the autonomous-triage-bot
# PR merges.
name: "[DEMO] Triage bot live run"

on:
    workflow_dispatch:

# Default to read-only; each job elevates only what it needs.
permissions:
    contents: read

jobs:
    # Duplicate detection, the docs/existing-support answer, the enhancement
    # proposal, and the missing-info request all resolve inside the classify
    # layer before the pipeline's trust gate -- no cluster, seconds not
    # minutes.
    demo-classify:
        name: "Run demo (issue ${{ matrix.issue }})"
        runs-on: ubuntu-latest
        permissions:
            issues: write
            contents: read
            pull-requests: read
        concurrency:
            group: demo-classify-${{ matrix.issue }}
            cancel-in-progress: true
        strategy:
            fail-fast: false
            matrix:
                # 2728: enhancement, 2729: docs already answer this,
                # 2730: too vague to reproduce, 2731: non-duplicate enhancement.
                issue: [2728, 2729, 2730, 2731]
        steps:
            - name: Check out code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: "3.12"

            - name: Install tox
              run: python -m pip install 'tox<5'

            - name: Run triage bot
              working-directory: ci
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GOOGLE_API_KEY: ${{ secrets.TRIAGE_GOOGLE_API_KEY }}
              run: tox -e triage-run -- --issue ${{ matrix.issue }} --action opened --auto-pr

    # #2727 is a real bug: CoreDNS replicas lack spreading constraints.
    # This reaches the full reproduce -> verify -> reproducer -> diagnose ->
    # fix pipeline -- builds the snap, spins up an LXD cluster, writes and
    # runs a real e2e test -- the same self-hosted,
    # tens-of-minutes cost the real pipeline job documents.
    demo-pipeline:
        name: "Run demo (bug -> real reproduce/fix pipeline)"
        runs-on: [self-hosted, linux, noble, xlarge]
        permissions:
            issues: write
            contents: write
            pull-requests: write
        concurrency:
            group: demo-pipeline-2727
            # Matches the real pipeline job: a cancelled run may not reach
            # its cleanup finally-block, orphaning the LXD cluster.
            cancel-in-progress: false
        steps:
            - name: Check out code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: "3.12"

            - name: Install tox
              run: python -m pip install 'tox<5'

            - name: Run triage bot
              working-directory: ci
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GOOGLE_API_KEY: ${{ secrets.TRIAGE_GOOGLE_API_KEY }}
              run: tox -e triage-run -- --issue 2727 --action opened --auto-pr
