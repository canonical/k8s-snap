#
# DEMO ONLY -- delete this workflow (and ci/demo_triage_5_issues.py) before
# the autonomous-triage-bot PR merges.
#
# Runs the triage bot's real decision engine (classification, duplicate
# detection, docs/existing-support check, enhancement proposals) against the
# latest real k8s-snap issues, in dry-run, so maintainers reviewing the PR
# can see actual model output without waiting for a real webhook event.
# Every GitHub write is intercepted client-side and only printed, never
# sent -- see ci/demo_triage_5_issues.py for the safety details.
name: "[DEMO] Triage bot dry-run"

on:
    workflow_dispatch:
    push:
        branches: [feat/autonomous-triage-bot]
        paths:
            - "ci/demo_triage_5_issues.py"
            - "ci/triage_bot/**"
            - "ci/tox.ini"
            - ".github/workflows/demo-triage-bot.yaml"

concurrency:
    group: demo-triage-bot-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    issues: read

jobs:
    demo:
        name: Run demo (dry-run, no cluster, no writes)
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
              with:
                  persist-credentials: false

            - name: Setup Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: "3.12"

            - name: Install tox
              run: python -m pip install 'tox<5'

            - name: Run demo
              working-directory: ci
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GOOGLE_API_KEY: ${{ secrets.TRIAGE_GOOGLE_API_KEY }}
              run: tox -e demo -- --count 5
