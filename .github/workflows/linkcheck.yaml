name: Linkcheck 

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      target:
        description: 'Release target to check out when invoked from scheduled workflows; leave empty on pull requests to check out the merge commit'
        type: string
        required: false
        default: ''
      changed_files:
        type: string
        default: ''

jobs:
  linkcheck:
    name: Run linkchecker
    runs-on: ubuntu-latest
    steps:
      - name: Validate target ref
        shell: bash
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          if [ -n "$INPUT_TARGET" ] && [[ ! "$INPUT_TARGET" =~ ^(main|release-[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Invalid target ref '$INPUT_TARGET'; must match ^(main|release-[0-9]+\.[0-9]+)$"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.target }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      - name: Run linkcheck 
        env:
          INPUT_CHANGED_FILES: ${{ inputs.changed_files }}
        run: |
          CHANGED_FILES="$INPUT_CHANGED_FILES"
          echo "Running linkcheck with files: $CHANGED_FILES"

          python3 docs/canonicalk8s/_dev/linkcheck.py docs/canonicalk8s \
            --install_target install \
            --linkcheck_target linkcheck \
            --makefile Makefile \
            "$CHANGED_FILES"
        shell: bash  
