name: Check for component upgrades

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: read

jobs:
  update:
    permissions:
      contents: write # for peter-evans/create-pull-request to create branch
      pull-requests: write # for peter-evans/create-pull-request to create a PR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          # Keep main branch up to date
          - main
          # Supported release branches
          - release-1.37
          - release-1.36
          - release-1.35
          - release-1.34
          - release-1.33
          - release-1.32

    steps:
      - name: Checkout hash-pinned hack requirements
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: build-scripts/hack/requirements.txt
      - name: Stage hack requirements
        run: cp build-scripts/hack/requirements.txt "$RUNNER_TEMP/hack-requirements.txt"
      - name: Checking out repo
        # zizmor: ignore[artipacked] BOT_SSH_KEY configured for component git operations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.branch }}
          ssh-key: ${{ secrets.BOT_SSH_KEY }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip3 install --require-hashes -r "$RUNNER_TEMP/hack-requirements.txt"

      - name: Check for new component versions
        run: |
          ./build-scripts/hack/update-component-versions.py \
             $(test "$GITHUB_EVENT_NAME" = "pull_request" && echo "--dry-run")

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          commit-message: "[${{ matrix.branch }}] Update component versions"
          title: "[${{ matrix.branch }}] Update component versions"
          body: "[${{ matrix.branch }}] Update component versions"
          branch: "autoupdate/sync/${{ matrix.branch }}"
          labels: |
            automerge
          delete-branch: true
          base: ${{ matrix.branch }}
          token: ${{ secrets.BOT_TOKEN }}
          author: "K8s builder bot <k8s-bot@canonical.com>"
