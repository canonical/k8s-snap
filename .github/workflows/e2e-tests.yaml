name: Run e2e tests

permissions:
  contents: read # for actions/checkout to fetch code
  actions: read # for gh run download to fetch artifacts

on:
  workflow_call:
    inputs:
      arch: &arch
        description: Job runner architecture (amd64 or arm64)
        default: amd64
        type: string
      os: &os
        description: LXD image to use when running e2e tests
        default: ubuntu:24.04
        type: string
      substrate: &substrate
        description: Substrate to use when running e2e tests
        default: lxd
        type: string
      # Download k8s-snap using either a GH action artifact or a snap channel.
      artifact:
        description: The name of a GH action artifact
        type: string
      channel:
        description: k8s snap channel
        type: string
      test-tags: &test-tags
        description: Integration test filter tags (e.g. pull_request, up_to_weekly)
        default: pull_request
        type: string
      flavor:
        description: Test flavor (e.g. strict), leave empty for classic
        default: ""
        type: string
      extra-test-args: &extra-test-args
        description: |
          Additional pytest arguments, use "-k <test_name>" to run a specific test
        default: ""
        type: string
      runner-tags: &runner-tags
        description: |
          Optional dictionary mapping test names to specific runner and tags.
          This is useful if specific tests require more powerful/larger runners, e.g. for version upgrade tests.
          The amount of self-hosted runners is limited so we should selectively assign tests to them.
          The arch tag will automatically be assigned based on the 'arch' input, so don't use the full tags here.
          (e.g. use ["self-hosted", "linux", "noble", "xlarge"] instead of ["self-hosted-linux-amd64-noble-xlarge"])
        type: string
        required: false
        default: |
          {
            "tests/test_version_upgrades.py::test_version_upgrades": [
              "self-hosted",
              "linux",
              "noble",
              "xlarge"
            ],
            "tests/test_version_upgrades.py::test_version_downgrades_with_rollback": [
              "self-hosted",
              "linux",
              "noble",
              "xlarge"
            ]
          }
      test-collection-repo:
        description: |
          Repository to use for collecting tests. Can be used to override the default behavior of
          collecting tests from the same repository as the workflow is running in.
        type: string
        required: false
        default: ${{ github.repository }}
      test-collection-branch:
        description: |
          Branch to use for collecting tests. Can be used to override the default behavior of
          collecting tests from the release branch matching the channel or main branch.
        type: string
        required: false
        default: ""
      extra-test-env: &extra-test-env
        description: 'Additional environment variables in KEY1=VALUE1,KEY2=VALUE2 format'
        type: string
        required: false
        default: ''
      parallel: &parallel
        description: Run tests in parallel using GitHub Actions matrix
        type: boolean
        default: true
      max-parallel: &max-parallel
        description: |
          Maximum number of parallel jobs to run
        default: 100
        type: number
      upload-results:
        description: Whether to upload per-test JSON artifacts
        type: boolean
        default: false
    secrets:
      UBUNTU_PRO_TOKEN:
        description: An optional Ubuntu Pro token to use for multipass tests
        required: false
      LAUNCHPAD_K8S_CI_BOT_PASSWORD:
        description: Password for the k8s-team-ci bot on Launchpad, used for DISA-STIG tests
        required: false

  workflow_dispatch:
    # Note(ben): workflow_dispatch only supports up to 10 parameters.
    # So, we cannot duplicate all inputs here. See:
    # https://github.com/orgs/community/discussions/8774
    inputs:
      arch: *arch
      os: *os
      substrate: *substrate
      channel:
        description: k8s snap channel
        type: string
        default: latest/edge
      runner-tags: *runner-tags
      test-tags: *test-tags
      max-parallel: *max-parallel
      extra-test-args: *extra-test-args
      extra-test-env: *extra-test-env
      parallel: *parallel

jobs:
  prepare:
    name: Prepare Environment
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    outputs:
      tests: ${{ steps.collect-tests.outputs.tests }}
      test-runners: ${{ steps.compute-test-runners.outputs.test_runners }}
      repo: ${{ steps.resolve-source.outputs.repo }}
      revision: ${{ steps.resolve-source.outputs.revision }}
    steps:
      - name: Resolve source for test collection
        id: resolve-source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_REPO: ${{ github.repository }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_TEST_COLLECTION_BRANCH: ${{ inputs.test-collection-branch }}
          INPUT_TEST_COLLECTION_REPO: ${{ inputs.test-collection-repo }}
        run: |
          # Determine from which rev to collect the tests, resolved in order:
          # 1. inputs.test-collection-branch if set
          # 2. release branch matching the channel (e.g. release-1.33 for 1.33-classic/edge)
          # 3. main branch

          CHANNEL="$INPUT_CHANNEL"
          REVISION="main"
          # Match X.YY or X.YY-classic, optionally followed by a risk suffix like /edge or /candidate
          # e.g. "1.33-classic/edge" or "1.33/edge"
          if [[ -n "$CHANNEL" && "$CHANNEL" =~ ^([0-9]+)\.([0-9]+)(-classic)?(/.*)?$ ]]; then
            REVISION="release-${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          fi

          if [ -n "$INPUT_TEST_COLLECTION_BRANCH" ]; then
            REVISION="$INPUT_TEST_COLLECTION_BRANCH"
          fi

          TARGET_REPO="${INPUT_TEST_COLLECTION_REPO:-$DEFAULT_REPO}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "schedule" ]]; then
            if [[ "$TARGET_REPO" != "$DEFAULT_REPO" ]]; then
              echo "Error: test-collection-repo ($TARGET_REPO) must match $DEFAULT_REPO for $EVENT_NAME events" >&2
              exit 1
            fi
            if [[ ! "$REVISION" =~ ^(main|release-[0-9]+\.[0-9]+)$ ]]; then
              echo "Error: resolved revision ($REVISION) must match main or release-X.Y for $EVENT_NAME events" >&2
              exit 1
            fi
          fi

          echo "Using git ref $REVISION for channel: $CHANNEL in $TARGET_REPO"
          {
            echo "repo<<EOF"
            printf '%s\n' "$TARGET_REPO"
            echo "EOF"
            echo "revision<<EOF"
            printf '%s\n' "$REVISION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.resolve-source.outputs.repo }}
          ref: ${{ steps.resolve-source.outputs.revision }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install tox
        uses: $/.github/actions/retry-command
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 5
          command: |
            sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
            for f in /etc/apt/sources.list.d/*; do
              [ -f "$f" ] && grep -q "packages.microsoft.com" "$f" 2>/dev/null && sudo rm -f "$f" || true
            done
            sudo apt-get update
            sudo apt-get install -y tox
      - name: Compute test runners
        id: compute-test-runners
        env:
          RUNNER_TAGS: ${{ inputs.runner-tags }}
          ARCH: ${{ inputs.arch }}
        run: |
          # Github Actions does not support dynamic concatination of lists, so we need to add the arch tag here.
          # See https://github.com/orgs/community/discussions/11401
          TEST_RUNNERS=$(jq -c -n "$RUNNER_TAGS" | jq -c --arg arch "$ARCH" 'with_entries(.value += [$arch])')
          echo "test_runners=$TEST_RUNNERS" >> $GITHUB_OUTPUT
      - name: Collect tests
        id: collect-tests
        env:
          TEST_TAGS: ${{ inputs.test-tags }}
        run: |
          cd tests/integration
          # Split the input tags into an array and pass them as individual args
          IFS=' ' read -ra TAGS <<< "$TEST_TAGS"
          TAGS_ARGS=""
          for tag in "${TAGS[@]}"; do
            TAGS_ARGS="$TAGS_ARGS --tags $tag"
          done

          # Collect test names and convert to JSON array for GitHub Actions
          # There is no easy way to get the test names from pytest, so we use the --collect-only flag
          # and parse the output to extract the test names.
          TEST_FILES=$(tox -e integration -- --collect-only $TAGS_ARGS --quiet --no-header tests/ | grep ::)

          JSON_ARRAY=$(printf '%s\n' "$TEST_FILES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "tests=$JSON_ARRAY" >> $GITHUB_OUTPUT
          echo "Found test files: $TEST_FILES"

  run-tests:
    name: ${{ matrix.test }}
    needs: prepare
    runs-on: ${{ fromJson(needs.prepare.outputs.test-runners)[matrix.test] || (inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04') }}
    # Backstop below GitHub's silent 360min default.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        test: ${{ inputs.parallel && fromJson(needs.prepare.outputs.tests) || fromJson('["e2e-tests"]') }}
    steps:
      - name: Node Cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ needs.prepare.outputs.repo }}
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - name: Check out CI tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ci-tooling
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Download k8s-snap
        id: download-snap
        uses: $/.github/actions/download-k8s-snap
        with:
          channel: ${{ inputs.channel }}
          artifact: ${{ inputs.artifact }}
      - name: Setup LXD
        if: ${{ inputs.substrate == 'lxd' }}
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          bridges: "lxdbr0,dualstack-br0,ipv6-br0,jumbo-br0,dual-nic-br0"
          channel: "5.21/stable"
      - name: Setup Multipass
        if: ${{ inputs.substrate == 'multipass' }}
        uses: $/.github/actions/setup-multipass
      - name: Install tox
        uses: $/.github/actions/retry-command
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 5
          command: |
            sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
            for f in /etc/apt/sources.list.d/*; do
              [ -f "$f" ] && grep -q "packages.microsoft.com" "$f" 2>/dev/null && sudo rm -f "$f" || true
            done
            sudo apt-get update
            sudo apt-get install -y tox
      - name: Generate names for step and artifacts
        if: ${{ always() }}
        env:
          MATRIX_TEST: ${{ matrix.test }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_OS: ${{ inputs.os }}
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          FULL_TEST_NODE_ID="${MATRIX_TEST}"
          # Extract short test name (part after '::') for the step display name
          SHORT_TEST_NAME="${FULL_TEST_NODE_ID##*::}"
          echo "short_test_name=${SHORT_TEST_NAME}" >> $GITHUB_ENV

          CHANNEL="${INPUT_CHANNEL}"
          if [ -n "$CHANNEL" ]; then
            RAW_ARTIFACT_NAME_BASE="${INPUT_OS}-${INPUT_ARCH}-${CHANNEL}-${FULL_TEST_NODE_ID}-$(uuidgen)"
          else
            RAW_ARTIFACT_NAME_BASE="${INPUT_OS}-${INPUT_ARCH}-${FULL_TEST_NODE_ID}-$(uuidgen)"
          fi
          SANITIZED_ARTIFACT_NAME=$(echo "$RAW_ARTIFACT_NAME_BASE" | sed 's/[\/:\.\]/-/g' | sed 's/\s//g')
          echo "test_name=${SANITIZED_ARTIFACT_NAME}" >> $GITHUB_ENV
      - name: Collect run context
        if: ${{ always() }}
        env:
          MATRIX_TEST: ${{ matrix.test }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_OS: ${{ inputs.os }}
          INPUT_ARCH: ${{ inputs.arch }}
          INPUT_SUBSTRATE: ${{ inputs.substrate }}
          INPUT_FLAVOR: ${{ inputs.flavor }}
          INPUT_ARTIFACT: ${{ inputs.artifact }}
          SNAP_REVISION: ${{ steps.download-snap.outputs.snap-revision }}
          TEST_COLLECTION_REPO: ${{ needs.prepare.outputs.repo }}
          TEST_COLLECTION_REF: ${{ needs.prepare.outputs.revision }}
        run: |
          # Report the commit that actually ran (collection ref may differ
          # from the triggering ref).
          ctx_sha=$(git rev-parse --verify --quiet HEAD 2>/dev/null || echo unknown)
          ctx_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"

          {
            echo "ctx_test=${MATRIX_TEST}"
            echo "ctx_channel=${INPUT_CHANNEL}"
            echo "ctx_revision=${SNAP_REVISION}"
            echo "ctx_artifact=${INPUT_ARTIFACT}"
            echo "ctx_os=${INPUT_OS}"
            echo "ctx_arch=${INPUT_ARCH}"
            echo "ctx_substrate=${INPUT_SUBSTRATE}"
            echo "ctx_flavor=${INPUT_FLAVOR:-classic}"
            echo "ctx_runner=${RUNNER_NAME} (${RUNNER_ENVIRONMENT}, ${RUNNER_OS}/${RUNNER_ARCH})"
            echo "ctx_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "ctx_sha=${ctx_sha}"
            echo "ctx_source=${TEST_COLLECTION_REPO}@${TEST_COLLECTION_REF}"
            echo "ctx_run_url=${ctx_run_url}"
          } >> "$GITHUB_ENV"
      - name: Performance flags
        if: ${{ contains(inputs.test-tags, 'performance') }}
        run: |
          echo "PERFORMANCE_FLAGS=--benchmark-storage=baselines --benchmark-autosave" >> $GITHUB_ENV
      - name: Run ${{ inputs.parallel && env.short_test_name || 'all tests' }}
        env:
          TEST_SNAP: ${{ steps.download-snap.outputs.snap-path }}
          TEST_SUBSTRATE: ${{ inputs.substrate }}
          TEST_LXD_IMAGE: ${{ inputs.os }}
          TEST_MULTIPASS_IMAGE: ${{ inputs.os }}
          TEST_FLAVOR: ${{ inputs.flavor }}
          TEST_INSPECTION_REPORTS_DIR: ${{ github.workspace }}/inspection-reports/${{ env.test_name }}
          TEST_VERSION_UPGRADE_CHANNELS: ${{ github.event_name == 'pull_request' && 'recent 2' || 'recent 6' }}
          TEST_VERSION_DOWNGRADE_CHANNELS: ${{ github.event_name == 'pull_request' && 'recent 2' || 'recent 6' }}
          TEST_VERSION_UPGRADE_MIN_RELEASE: "1.32"
          TEST_STRICT_INTERFACE_CHANNELS: "recent 6 strict"
          TEST_MIRROR_LIST: '[{"name": "ghcr.io", "port": 5000, "remote": "https://ghcr.io", "username": "${{ github.actor }}", "password": "${{ secrets.GITHUB_TOKEN }}"}, {"name": "docker.io", "port": 5001, "remote": "https://registry-1.docker.io", "username": "", "password": ""}]'
          TEST_GH_REF: ${{ needs.prepare.outputs.revision || github.ref_name }}
          TEST_GH_BASE_REF: ${{ github.base_ref }}
          TEST_UBUNTU_PRO_TOKEN: ${{ secrets.UBUNTU_PRO_TOKEN }}
          TEST_LAUNCHPAD_K8S_CI_BOT_PASSWORD: ${{ secrets.LAUNCHPAD_K8S_CI_BOT_PASSWORD }}
          EXTRA_TEST_ENV: ${{ inputs.extra-test-env }}
          PARALLEL_TEST: ${{ inputs.parallel && matrix.test || '' }}
          INPUT_TEST_TAGS: ${{ inputs.test-tags }}
          EXTRA_TEST_ARGS: ${{ inputs.extra-test-args }}
        run: |
          # Parse extra-test-env and export each KEY=VALUE pair
          ESCAPED_ENV=$(echo "$EXTRA_TEST_ENV" | sed 's/"/\\"/g')
          if [ -n "${ESCAPED_ENV}" ]; then
            IFS=',' read -ra ENV_VARS <<< "${ESCAPED_ENV}"
            for kv in "${ENV_VARS[@]}"; do
              echo "Exporting $kv"
              export "$kv"
            done
          fi

          cd tests/integration && sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- tox -e integration -- $PARALLEL_TEST $PERFORMANCE_FLAGS --tags $INPUT_TEST_TAGS $EXTRA_TEST_ARGS
      - name: Report failure context
        if: ${{ failure() || cancelled() }}
        run: |
          # tee so the same block lands in the job log and the run summary.
          python3 ci-tooling/ci/k8s-ci.py e2e print-failure-context | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Prepare inspection reports
        if: failure() || cancelled()
        run: |
          mkdir -p inspection-report-archives
          tar -czvf "inspection-report-archives/${test_name}.tar.gz" -C "$GITHUB_WORKSPACE" "inspection-reports/${test_name}" || true
      - name: Upload inspection report artifact
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: inspection-reports-${{ env.test_name }}
          path: ${{ github.workspace }}/inspection-report-archives/${{ env.test_name }}.tar.gz
      - name: Upload CNCF conformance report artifact
        if: always() && contains(inputs.test-tags, 'conformance_tests')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonobuoy-e2e-${{ env.test_name }}
          path: tests/integration/sonobuoy_e2e.tar.gz
      - name: Generate HTML test report
        if: ${{ (failure() || cancelled()) && contains(inputs.extra-test-args, '--subunit-path') }}
        run: |
          cd tests/integration
          if [ -f subunit.out ]; then
            subunit2html subunit.out subunit.html
          fi
      - name: Upload html test report
        if: ${{ (failure() || cancelled()) && contains(inputs.extra-test-args, '--subunit-path') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: subunit-${{ env.test_name }}.html
          path: tests/integration/subunit.html
      - name: Prepare performance test results
        if: contains(inputs.test-tags, 'performance')
        run: |
          mkdir -p performance-test-results
          mv tests/integration/baselines/*/0001_*.json \
            "performance-test-results/${test_name}.json"
      - name: Upload performance test results
        if: contains(inputs.test-tags, 'performance')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: performance-test-results-${{ env.test_name }}
          path: performance-test-results
      - name: Upload test metadata
        if: ${{ inputs.upload-results && always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 ci-tooling/ci/k8s-ci.py e2e write-result-json --output results/result.json
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ inputs.upload-results && always() }}
        with:
          name: result-${{ env.test_name }}
          path: results/result.json
          if-no-files-found: warn
