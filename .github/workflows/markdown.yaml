name: "Docs: Markdown lint"

on:
  pull_request:
    paths:
      - 'docs/**'
      - '!docs/canonicalk8s/_parts/**'

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Create venv
        working-directory: "docs/canonicalk8s"
        run: make install
      - name: Lint markdown
        working-directory: "docs/canonicalk8s"
        run: make lint-md
