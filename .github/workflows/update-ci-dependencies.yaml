name: Update CI dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  update-github-actions:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install Python dependencies
        run: pip install --require-hashes -r ci/requirements-pip-tools.txt

      - name: Check for action updates
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/k8s-ci.py deps update-actions

      - name: Create pull request
        if: steps.check.outputs.has-changes == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          commit-message: "ci: update GitHub Actions to latest versions"
          title: "ci: update GitHub Actions to latest versions"
          body: |
            Automated update of SHA-pinned GitHub Actions.

            ${{ steps.check.outputs.summary }}
          branch: automation/update-actions
          base: main
          labels: automerge
          delete-branch: true
          token: ${{ secrets.BOT_TOKEN }}
          author: "K8s builder bot <k8s-bot@canonical.com>"

  update-pip-dependencies:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install pip-tools
        run: pip install --require-hashes -r ci/requirements-pip-tools.txt

      - name: Update pip lock files
        id: check
        run: python ci/k8s-ci.py deps update-pip-locks

      - name: Create pull request
        if: steps.check.outputs.has-changes == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          commit-message: "ci: update pip dependencies"
          title: "ci: update pip dependencies"
          body: |
            Automated update of hash-pinned pip dependencies.

            ${{ steps.check.outputs.summary }}
          branch: automation/update-pip-deps
          base: main
          labels: automerge
          delete-branch: true
          token: ${{ secrets.BOT_TOKEN }}
          author: "K8s builder bot <k8s-bot@canonical.com>"
