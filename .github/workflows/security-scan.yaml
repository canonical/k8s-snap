name: Security scan

permissions:
  contents: read # for actions/checkout to fetch code

on:
  workflow_call:
    inputs:
      # Download k8s-snap using either a GH action artifact or a snap channel.
      artifact:
        description: The name of a GH action artifact.
        type: string
      channel:
        description: k8s snap channel.
        type: string
      checkout-ref:
        description: k8s-snap git checkout ref, optional.
        type: string
      upload-reports-to-jira:
        description: Whether to send the security vulnerabilities to Jira or not.
        required: false
        type: boolean
        default: false
      upload-sarif:
        description: Whether to upload SARIF results to GitHub Code Scanning.
        required: false
        type: boolean
        default: true
    secrets:
      CVE_JIRA_WEBHOOK_URL:
        description: Webhook URL for uploading CVE reports to Jira.
        required: false
      CVE_JIRA_WEBHOOK_TOKEN:
        description: Auth token for the Jira CVE webhook.
        required: false

jobs:
  security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          # We run into rate limiting issues if we don't authenticate
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Need to fetch the GH actions first.
      - name: Checking out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Save trivy-scan.sh script
        run: |
          # We'll need to scan other branches, let's create a copy of
          # the Trivy scan script.
          cp tests/trivy-scan.sh $GITHUB_WORKSPACE/trivy-scan.sh
      - name: Download k8s-snap
        id: download-snap
        uses: $/.github/actions/download-k8s-snap
        with:
          channel: ${{ inputs.channel }}
          artifact: ${{ inputs.artifact }}
      - name: Checking out tested repo branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout-ref }}
          # Persist downloaded artifacts
          clean: 'false'
      - name: Run Trivy vulnerability scanner
        id: trivy-scan
        env:
          SNAP_PATH: ${{ steps.download-snap.outputs.snap-path }}
        run: |
          cp $GITHUB_WORKSPACE/trivy-scan.sh ./tests/trivy-scan.sh
          ./tests/trivy-scan.sh "$SNAP_PATH"
      - name: Stage SARIF reports for Code Scanning
        if: ${{ !cancelled() && inputs.upload-sarif == true && (steps.trivy-scan.outcome == 'success' || steps.trivy-scan.outcome == 'failure') }}
        run: |
          mkdir -p ./.trivy/repo-sarifs ./.trivy/snap-sarifs
          shopt -s nullglob
          for f in ./.trivy/sarifs/trivy-k8s-repo-scan--results*.sarif; do
            cp "$f" ./.trivy/repo-sarifs/
          done
          for f in ./.trivy/sarifs/snap*.sarif; do
            cp "$f" ./.trivy/snap-sarifs/
          done
      - name: Get checked out commit SHA
        if: ${{ !cancelled() && inputs.upload-sarif == true && (steps.trivy-scan.outcome == 'success' || steps.trivy-scan.outcome == 'failure') }}
        id: scan-ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload Trivy repo scan results to GitHub Security tab
        if: ${{ !cancelled() && inputs.upload-sarif == true && (steps.trivy-scan.outcome == 'success' || steps.trivy-scan.outcome == 'failure') && hashFiles('.trivy/repo-sarifs/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ./.trivy/repo-sarifs
          # Attribute results to the branch that was actually scanned,
          # not the branch that triggered the workflow. Without this,
          # scheduled scans of release branches get attributed to main
          # and create alerts that can never be resolved.
          ref: ${{ inputs.checkout-ref && (startsWith(inputs.checkout-ref, 'refs/') && inputs.checkout-ref || format('refs/heads/{0}', inputs.checkout-ref)) || github.ref }}
          sha: ${{ inputs.checkout-ref && steps.scan-ref.outputs.sha || github.sha }}
          category: trivy-repo-scan${{ inputs.checkout-ref && format('/{0}', inputs.checkout-ref) || '' }}
      - name: Upload Trivy snap scan results to GitHub Security tab
        if: ${{ !cancelled() && inputs.upload-sarif == true && (steps.trivy-scan.outcome == 'success' || steps.trivy-scan.outcome == 'failure') && hashFiles('.trivy/snap-sarifs/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ./.trivy/snap-sarifs
          # Attribute results to the branch that was actually scanned,
          # not the branch that triggered the workflow. Without this,
          # scheduled scans of release branches get attributed to main
          # and create alerts that can never be resolved.
          ref: ${{ inputs.checkout-ref && (startsWith(inputs.checkout-ref, 'refs/') && inputs.checkout-ref || format('refs/heads/{0}', inputs.checkout-ref)) || github.ref }}
          sha: ${{ inputs.checkout-ref && steps.scan-ref.outputs.sha || github.sha }}
          category: trivy-snap-scan${{ inputs.checkout-ref && format('/{0}', inputs.checkout-ref) || '' }}
      - name: Send vulnerability records
        if: ${{ inputs.upload-reports-to-jira == true }}
        uses: canonical/k8s-workflows/.github/actions/send-cve-reports@03b536d75aebd6b3701178b978532b6fcbccf9c1 # main
        with:
          reports: "./.trivy/sarifs/trivy-k8s-repo-scan--results.sarif,./.trivy/sarifs/snap.sarif"
          jira-url: ${{ secrets.CVE_JIRA_WEBHOOK_URL }}
          jira-auth-token: ${{ secrets.CVE_JIRA_WEBHOOK_TOKEN }}
          minimum-level: "HIGH"
          bump-cisa-cves: true
