name: Cut release branch

on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - build-scripts/components/kubernetes/version

permissions:
  contents: read

jobs:
  cut-release-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # zizmor: ignore[artipacked] BOT_SSH_KEY must remain configured for git push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ssh-key: ${{ secrets.BOT_SSH_KEY }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip3 install --require-hashes -r ci/requirements-release.txt
      - name: Define git credentials
        run: |
          # Needed to create commits.
          git config --global user.name "Github Actions"
          git config --global user.email "worker@org.com"
      - name: Prepare release git branch
        run: |
          python3 ./build-scripts/k8s_release.py cut_release_branch
