name: SBOM

on:
  push:
    paths-ignore:
      - 'docs/**'
    branches:
      - main
      - autoupdate/strict
      - 'release-[0-9]+.[0-9]+'
      - 'autoupdate/release-[0-9]+.[0-9]+-strict'
      - 'autoupdate/sync/**'
  pull_request:
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

jobs:
  changes:
    name: Detect lb-dataplane repro PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      lb-dataplane: ${{ steps.changes.outputs.lb-dataplane }}
    steps:
      - name: Checking out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Detect lb-dataplane repro PR
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && git diff --name-only HEAD^1 HEAD | grep -q "^tests/integration/lxd-triple-nic-profile.yaml"; then
            echo "lb-dataplane=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: [changes]
    if: needs.changes.outputs.lb-dataplane != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checking out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip3 install --require-hashes -r ./build-scripts/hack/requirements.txt
      - name: Build SBOM
        run: |
          ./build-scripts/hack/generate-sbom.py sbom.tar.gz
          tar xvzf sbom.tar.gz
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom
