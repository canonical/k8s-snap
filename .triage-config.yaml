kind_labels: ["bug", "enhancement", "documentation", "question"]
area_labels: ["network", "storage", "dns", "ingress", "observability", "security", "cluster-lifecycle", "api", "snap", "performance"]
docs_dir: "docs/canonicalk8s"
docs_base_url: "https://documentation.ubuntu.com/canonical-kubernetes/latest"
inspection_command: "sudo /snap/k8s/current/k8s/scripts/inspect.sh"
cleanup_command: ["bash", "hack/cluster-up.sh", "--prefix", "{PREFIX}", "--destroy"]
protected_paths_regex:
  - "^build-scripts/components/[^/]+/(repository|version)$"
  # Anything CI executes: the producing agent is unprivileged, but the
  # publish job pushes its branch, so a bundled workflow change would run
  # with the publisher's permissions.
  - "^\\.github/"
  # The bot's own guardrails: its routing/prompt/protected-path policy. A
  # prompt-injected run could otherwise propose a PR that widens what the
  # next run is allowed to do.
  - "^\\.triage-config\\.yaml$"
  - "^\\.agents/"
  # The orchestrator executes this on the self-hosted runner, with sudo and
  # LXD in reach, so it is bot-executable code in the same sense as a workflow.
  - "^hack/"
  # AGENTS.md files are the agent's own project instructions, so a generated
  # fix must not be able to rewrite what the next run is told to do.
  - "(^|/)AGENTS\\.md$"
  # Read by hack/cluster-up.sh when it creates the LXD profile, so it decides
  # what the pipeline's containers are allowed to do.
  - "^tests/integration/lxd-profile\\.yaml$"
  # CI automation and the snap build: executed by workflows on the branch the
  # publisher pushes here, and never something a bug fix needs to touch.
  - "^ci/"
  - "^build-scripts/"
  # Same build as build-scripts/: override-build and the part definitions
  # run during snapcraft, so protecting only the scripts they call is half
  # a fence.
  - "^snap/"
  # The bot's job is to add a failing test case, not to change the harness
  # that runs one. Everything under tests/integration is protected except
  # test modules themselves -- so it can write tests/integration/tests/
  # test_*.py, but not conftest.py, test_util/, tox.ini or the fixtures every
  # other test in the suite depends on.
  - "^tests/integration/(?!tests/test_[^/]+\\.py$).*"
ignored_users: ["github-actions[bot]"]
maintainer_team: "canonical/kubernetes"
triage_skill_dir: ".agents/skills/triage"
