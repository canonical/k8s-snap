description: "LXD profile for Canonical Kubernetes with triple NIC setup (OAM/internal/public)"
devices:
  eth1:
    name: eth1
    nictype: bridged
    parent: LXD_TRIPLE_NIC_INTERNAL_NETWORK
    type: nic
  eth2:
    name: eth2
    nictype: bridged
    parent: LXD_TRIPLE_NIC_PUBLIC_NETWORK
    type: nic
config:
  user.network-config: |
    version: 2
    ethernets:
      eth0:
        dhcp4: true
        dhcp4-overrides:
          route-metric: 100
      eth1:
        dhcp4: true
        dhcp4-overrides:
          route-metric: 500
      eth2:
        dhcp4: true
        dhcp4-overrides:
          route-metric: 600