[tox]
skipsdist = True
skip_missing_interpreters = True
env_list = format, lint, unit, integration,

[testenv]
set_env =
    PYTHONBREAKPOINT=pdb.set_trace
    PY_COLORS=1
passenv =
    PYTHONPATH

[testenv:format]
description = Apply coding style standards to code
deps = -r {toxinidir}/requirements-dev.txt
commands =
    licenseheaders -t {toxinidir}/.copyright.tmpl -cy -o 'Canonical, Ltd' -d {toxinidir}/tests
    licenseheaders -t {toxinidir}/.copyright.tmpl -cy -o 'Canonical, Ltd' -d {toxinidir}/unit_tests
    isort {toxinidir}/tests {toxinidir}/unit_tests --profile=black
    black {toxinidir}/tests {toxinidir}/unit_tests

[testenv:lint]
description = Check code against coding style standards
deps = -r {toxinidir}/requirements-dev.txt
commands =
    codespell {toxinidir}/tests {toxinidir}/unit_tests
    flake8 {toxinidir}/tests {toxinidir}/unit_tests
    licenseheaders -t {toxinidir}/.copyright.tmpl -cy -o 'Canonical, Ltd' -d {toxinidir}/tests --dry
    licenseheaders -t {toxinidir}/.copyright.tmpl -cy -o 'Canonical, Ltd' -d {toxinidir}/unit_tests --dry
    isort {toxinidir}/tests {toxinidir}/unit_tests --profile=black --check
    black {toxinidir}/tests {toxinidir}/unit_tests --check --diff

[testenv:unit]
description = Run test_util unit tests
deps =
    -r {toxinidir}/requirements-test.txt
set_env =
    {[testenv]set_env}
    PYTHONPATH={toxinidir}/tests
commands =
    pytest \
        --tb=native \
        --disable-warnings \
        {posargs:{toxinidir}/unit_tests}

[testenv:integration]
description = Run integration tests
deps =
    -r {toxinidir}/requirements-test.txt
commands =
    pytest \
        --tb=native \
        --log-cli-level=DEBUG \
        --log-format="%(asctime)s %(levelname)s %(message)s" \
        --log-date-format="%Y-%m-%d %H:%M:%S" \
        --disable-warnings \
        {posargs:{toxinidir}/tests}

passenv =
    TEST_*

[flake8]
max-line-length = 120
select = E,W,F,C,N
ignore = W503,E231,E226
exclude = venv,.git,.tox,.tox_env,.venv,build,dist,*.egg_info
show-source = true
