[tox]
skipsdist = True
skip_missing_interpreters = True
env_list = format, lint, unit, integration, pytest-benchmark

[testenv]
set_env =
    PYTHONBREAKPOINT=pdb.set_trace
    PY_COLORS=1
passenv =
    PYTHONPATH

[testenv:format]
description = Apply coding style standards to code
deps = -r {toxinidir}/requirements-dev.txt
commands =
    licenseheaders -t {toxinidir}/.copyright.tmpl -cy -o 'Canonical, Ltd' -d {toxinidir}/tests
    licenseheaders -t {toxinidir}/.copyright.tmpl -cy -o 'Canonical, Ltd' -d {toxinidir}/tests_unit
    isort {toxinidir}/tests {toxinidir}/tests_unit --profile=black
    black {toxinidir}/tests {toxinidir}/tests_unit

[testenv:lint]
description = Check code against coding style standards
deps =
    -r {toxinidir}/requirements-dev.txt
    -r {toxinidir}/requirements-test.txt
set_env =
    PYTHONPATH = {toxinidir}/tests
commands =
    codespell {toxinidir}/tests {toxinidir}/tests_unit
    flake8 {toxinidir}/tests {toxinidir}/tests_unit
    licenseheaders -t {toxinidir}/.copyright.tmpl -cy -o 'Canonical, Ltd' -d {toxinidir}/tests --dry
    licenseheaders -t {toxinidir}/.copyright.tmpl -cy -o 'Canonical, Ltd' -d {toxinidir}/tests_unit --dry
    isort {toxinidir}/tests {toxinidir}/tests_unit --profile=black --check
    black {toxinidir}/tests {toxinidir}/tests_unit --check --diff
    pytest {toxinidir}/tests_unit

[testenv:bandit]
description = Run Bandit security linter on Python code
deps = -r {toxinidir}/requirements-dev.txt
commands =
    bandit -r {toxinidir}/tests {toxinidir}/tests_unit -c {toxinidir}/../../pyproject.toml -lll


[testenv:unit]
description = Run unit tests
deps =
    -r {toxinidir}/requirements-test.txt
set_env =
    PYTHONPATH = {toxinidir}/tests
commands =
    pytest {posargs:{toxinidir}/tests_unit}
[testenv:integration]
description = Run integration tests
deps =
    -r {toxinidir}/requirements-test.txt
commands =
    pytest \
        --tb=native \
        --log-cli-level=DEBUG \
        --log-format="%(asctime)s %(levelname)s %(message)s" \
        --log-date-format="%Y-%m-%d %H:%M:%S" \
        --disable-warnings \
        {posargs:{toxinidir}/tests}
passenv =
    TEST_*

[testenv:pytest-benchmark]
description = Run pytest-benchmark CLI commands
deps =
    -r {toxinidir}/requirements-perf.txt
commands =
    pytest-benchmark {posargs}

[flake8]
max-line-length = 120
select = E,W,F,C,N
ignore = W503,E231,E226
exclude = venv,.git,.tox,.tox_env,.venv,build,dist,*.egg_info
show-source = true
