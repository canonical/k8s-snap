description: "LXD profile for Canonical Kubernetes nodes with three NICs (management, cluster, public)"
devices:
  eth1:
    name: eth1
    network: LXD_MULTI_NIC_CLUSTER_NETWORK
    type: nic
  eth2:
    name: eth2
    network: LXD_MULTI_NIC_PUBLIC_NETWORK
    type: nic
config:
  user.network-config: |
    version: 2
    ethernets:
      eth0:
        dhcp4: true
      eth1:
        dhcp4: true
        dhcp4-overrides:
          use-routes: false
      eth2:
        dhcp4: true
        dhcp4-overrides:
          use-routes: false
