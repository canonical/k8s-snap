[tox]
skipsdist = True
skip_missing_interpreters = True
env_list = format, lint, bandit, k8s-ci

[testenv]
set_env =
    PYTHONBREAKPOINT=pdb.set_trace
    PY_COLORS=1
passenv =
    PYTHONPATH

[testenv:format]
description = Apply coding style standards to code
deps = -r {toxinidir}/requirements-ci.txt
commands =
    licenseheaders -t {toxinidir}/.copyright.tmpl -cy -o 'Canonical, Ltd' -d {toxinidir}
    isort {toxinidir} --profile=black
    black {toxinidir} --verbose

[testenv:lint]
description = Check code against coding style standards
deps = -r {toxinidir}/requirements-ci.txt
commands =
    codespell --skip .tox {toxinidir}
    flake8 {toxinidir}
    licenseheaders -t {toxinidir}/.copyright.tmpl -cy -o 'Canonical, Ltd' -d {toxinidir} --dry
    isort {toxinidir} --profile=black --check
    black {toxinidir} --check --diff

[testenv:bandit]
description = Run Bandit security linter on Python code
deps = -r {toxinidir}/requirements-ci.txt
commands =
    bandit -r {toxinidir} -c {toxinidir}/../pyproject.toml --exclude ./.tox -lll

[testenv:k8s-ci]
description = Invoke the k8s-ci CLI with any parameters passed to tox
deps =
    -r {toxinidir}/requirements-ci.txt
commands =
    python {toxinidir}/k8s-ci.py {posargs}
passenv =
    GITHUB_*
    MATTERMOST_*

[testenv:triage]
description = Run the triage bot unit tests (offline, no LLM)
deps =
    -r {toxinidir}/requirements-triage.txt
changedir = {toxinidir}/triage_bot
set_env =
    PYTHONPATH = {toxinidir}
commands =
    pytest {posargs:-q}

[testenv:triage-run]
description = Run the triage bot against a GitHub issue/comment event
deps =
    -r {toxinidir}/requirements-triage.txt
set_env =
    PYTHONPATH = {toxinidir}
commands =
    python {toxinidir}/cmds/triage.py run {posargs}
passenv =
    GITHUB_*
    GH_TOKEN
    GOOGLE_API_KEY
    GEMINI_API_KEY

[testenv:demo]
description = DEMO ONLY, remove before merge: run the triage bot's decision engine against real live issues, in dry-run, for maintainer demonstration
deps =
    -r {toxinidir}/requirements-triage.txt
set_env =
    PYTHONPATH = {toxinidir}
commands =
    python {toxinidir}/demo_triage_5_issues.py {posargs}
passenv =
    GITHUB_*
    GH_TOKEN
    GOOGLE_API_KEY
    GEMINI_API_KEY

[flake8]
max-line-length = 120
select = E,W,F,C,N
ignore = W503,E231,E226
exclude = venv,.git,.tox,.tox_env,.venv,build,dist,*.egg_info
show-source = true
