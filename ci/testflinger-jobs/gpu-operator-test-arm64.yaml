job_queue: jetson-agx-orin

# Skip provisioning - Jetson devices don't support MAAS-style distro provisioning.
# The device runs whatever OS was last flashed onto it.

# The GPU operator takes up to 10-15 mins to compile/install drivers inside k8s.
global_timeout: 2700  # 45 minutes total execution boundary

test_data:
  attachments:
    - local: k8s-arm64.snap
    - local: k8s-test-suite.tar.gz
  test_cmds: |
    #!/bin/bash
    set -eux

    SSH="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@$DEVICE_IP"
    SCP="scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

    # 1. Copy attachments to the device
    $SCP attachments/test/k8s-arm64.snap ubuntu@$DEVICE_IP:/tmp/
    $SCP attachments/test/k8s-test-suite.tar.gz ubuntu@$DEVICE_IP:/tmp/

    # 2. Set up test environment on the device
    # Use 'bash -s' to avoid login shell — .bash_logout can override
    # the exit code when clear_console fails over SSH with set -e.
    $SSH bash -s << 'REMOTE'
    set -eux
    export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"

    # Identify what we're running on (for debugging heterogeneous queue issues).
    echo "=== Device identification ==="
    cat /etc/os-release
    uname -a
    echo "apt-get location: $(which apt-get 2>/dev/null || echo 'NOT FOUND')"
    echo "snap version: $(snap version 2>/dev/null || echo 'NOT FOUND')"

    # Install dependencies and kernel headers (required for gpu-operator driver compilation).
    if command -v apt-get >/dev/null 2>&1; then
        # Clear outdated package cache (not wiped by MAAS on Jetsons).
        # apt-get update may return non-zero if a proxy corrupts some InRelease
        # signatures — tolerate partial failures.
        sudo rm -rf /var/lib/apt/lists/*
        sudo apt-get update || echo "WARNING: apt-get update had errors (partial repo failure); continuing..."
        sudo apt-get install -y python3-pip python3-venv tox linux-headers-$(uname -r) || \
            echo "WARNING: apt-get install had errors; some packages may be missing"
    else
        echo "ERROR: apt-get not available. This device may be running Ubuntu Core or a non-standard image."
        echo "ERROR: The gpu-operator test requires a full Ubuntu installation with apt."
        exit 1
    fi

    # Verify kernel headers were installed (if available)
    echo "=== Kernel: $(uname -r) ==="
    ls /usr/src/linux-headers-$(uname -r)/ 2>/dev/null | head -5 || echo "WARNING: kernel headers not found"
    echo "=== GPU info ==="
    lspci | grep -i nvidia || echo "No discrete NVIDIA GPU (integrated GPU expected on Jetson)"
    echo "=== Loaded nvidia modules ==="
    lsmod | grep nvidia || echo "none"

    # Unpack test suite
    cd /tmp
    tar xzf k8s-test-suite.tar.gz
    cd tests/integration

    # Run the GPU operator test directly on bare metal via SSH harness.
    export TEST_SNAP="/tmp/k8s-arm64.snap"
    export TEST_SUBSTRATE=bare_metal
    export TEST_BARE_METAL_SSH_HOST=localhost
    export TEST_BARE_METAL_SSH_USER=ubuntu
    export TEST_USE_LOCAL_MIRROR=0

    tox -e integration -- \
        --tags gpu
    RC=$?

    # Dump diagnostic info on failure
    if [ $RC -ne 0 ]; then
        echo "=== DIAGNOSTICS: gpu-operator namespace pods ==="
        sudo k8s kubectl get pods -n gpu-operator -o wide 2>/dev/null || true
        echo "=== DIAGNOSTICS: gpu-operator namespace daemonsets ==="
        sudo k8s kubectl get daemonsets -n gpu-operator 2>/dev/null || true
        echo "=== DIAGNOSTICS: gpu-operator controller logs ==="
        sudo k8s kubectl logs -n gpu-operator -l app=gpu-operator --tail=50 2>/dev/null || true
        echo "=== DIAGNOSTICS: node labels (nvidia/feature) ==="
        sudo k8s kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{range .metadata.labels}{"\t"}{@}{"\n"}{end}{end}' 2>/dev/null | grep -i -E 'nvidia|gpu|feature' || echo "no gpu/nvidia labels found"
        echo "=== DIAGNOSTICS: events ==="
        sudo k8s kubectl get events -n gpu-operator --sort-by='.lastTimestamp' 2>/dev/null | tail -30 || true
    fi

    exit $RC
    REMOTE
