job_queue: nvidia-dgx-station

provision_data:
  distro: jammy
  kernel: generic

# The GPU operator takes up to 10-15 mins to compile/install drivers inside k8s.
global_timeout: 2700  # 45 minutes total execution boundary

test_data:
  attachments:
    - local: k8s-amd64.snap
    - local: k8s-test-suite.tar.gz
  test_cmds: |
    #!/bin/bash
    set -eux

    SSH="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@$DEVICE_IP"
    SCP="scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

    # 1. Copy attachments to the device
    $SCP attachments/test/k8s-amd64.snap ubuntu@$DEVICE_IP:/tmp/
    $SCP attachments/test/k8s-test-suite.tar.gz ubuntu@$DEVICE_IP:/tmp/

    # 2. Run all test steps on the device via SSH
    $SSH << 'REMOTE'
    set -eux

    # Verify GPU hardware is present
    if ! lspci -k | grep -q "NVIDIA Corporation"; then
        echo "ERROR: No NVIDIA GPU detected on this machine."
        exit 1
    fi

    # Ensure no pre-loaded NVIDIA drivers (gpu-operator must manage them)
    if lsmod | grep -q "^nvidia"; then
        echo "NVIDIA drivers detected on host. Purging to allow GPU-operator to manage them..."
        sudo apt-get purge -y '^nvidia-.*' || true
        sudo apt-get autoremove -y || true
        sudo rmmod nvidia_uvm || true
        sudo rmmod nvidia_modeset || true
        sudo rmmod nvidia || true
    fi

    # Set up LXD (required substrate for the test framework)
    sudo snap install lxd --channel=latest/stable || true
    sudo lxd init --auto || true

    # Unpack test suite
    cd /tmp
    tar xzf k8s-test-suite.tar.gz
    cd tests/integration

    # Install test dependencies
    sudo apt-get update
    sudo apt-get install -y python3-pip python3-venv tox

    # Run the NVIDIA GPU operator test via tox
    export TEST_LXD_PROFILE="$(cat lxd-gpu-profile.yaml)"
    export TEST_SNAP="/tmp/k8s-amd64.snap"
    export TEST_SUBSTRATE=lxd
    export TEST_LXD_IMAGE="ubuntu:22.04"

    tox -e integration -- \
        -k "test_deploy_nvdia_gpu_operator" \
        --tags gpu
    REMOTE