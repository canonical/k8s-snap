version: 1

rules:
  # ---------------------------------------------------------------------
  # Infrastructure and provisioning.
  #
  # First, because these failures happen underneath the product: a job whose
  # LXD host ran out of disk will still print product-shaped errors as it
  # dies, and blaming those on the product is how CI triage loses its way.
  # ---------------------------------------------------------------------

  - id: infra-disk-full
    class: infra.runner
    subclass: disk_space
    excerpt_pattern: 'no space left on device|disk quota exceeded'
    notes: >-
      The runner filled its disk. Always infrastructure regardless of which
      command happened to report it first.

  - id: infra-oom
    class: infra.runner
    subclass: oom
    excerpt_pattern: 'Out of memory: Killed process|oom-kill|Cannot allocate memory'
    notes: >-
      Kernel OOM killer. The victim process is incidental, so this matches on
      text rather than on a pinned signature.

  - id: infra-lxd-setup
    class: infra.provisioning
    subclass: lxd_setup
    job:
      failed_step_name: '^(Setup LXD|Install LXD|Configure LXD)'
    notes: >-
      Failure before the product is installed. Stage A already routes most of
      these; this rule catches step-name variants it does not know about.

  - id: infra-multipass-setup
    class: infra.provisioning
    subclass: multipass_setup
    job:
      failed_step_name: '^(Setup Multipass|Install Multipass|Launch .*(VM|instance))'
    notes: >-
      FIPS and STIG suites run on Multipass; provisioning them is a frequent
      failure point that has nothing to do with the snap under test.

  # ---------------------------------------------------------------------
  # External dependencies.
  # ---------------------------------------------------------------------

  - id: external-snap-store
    class: external.dependency
    subclass: snap_store
    excerpt_pattern: 'cannot install "?k8s"?|snap "k8s" is not available|error: cannot perform the following tasks|cannot refresh .* store, error|too many requests'
    notes: >-
      Snap Store unavailability or throttling. Verified against weekly run
      33933942797, where six jobs failed in "Download k8s-snap".

  - id: external-registry
    class: external.dependency
    subclass: registry
    excerpt_pattern: '(ghcr\.io|docker\.io|registry\.k8s\.io|quay\.io).{0,80}(timeout|TLS handshake|no such host|connection refused|toomanyrequests|denied|500 Internal)'
    notes: >-
      Image pulls from a third-party registry. Scoped to a registry hostname
      so that in-cluster pull failures are not swept up with it.

  - id: external-apt
    class: external.dependency
    subclass: apt
    excerpt_pattern: 'Failed to fetch http.{0,120}(archive|security)\.ubuntu\.com|E: Unable to locate package|Could not get lock /var/lib/dpkg'
    notes: Ubuntu archive unreachable or busy during runner setup.

  - id: external-docs-linkcheck
    class: external.dependency
    subclass: dns
    job:
      failed_step_name: '^Run linkcheck$'
    notes: >-
      The docs link checker walks hundreds of third-party URLs and fails when
      any of them rate-limits or moves. Its log is a stream of per-link status
      lines with no single error, so the extracted excerpt is a meaningless
      tail and every job produces a fresh throwaway signature. Matched on the
      step name instead. Genuine broken links in our own docs still need
      fixing, but they are not a signal about the product, and the weekly
      suite should not be red because GitHub throttled a link probe.

  # ---------------------------------------------------------------------
  # CI configuration.
  # ---------------------------------------------------------------------

  - id: ci-test-collection
    class: ci.config
    subclass: test_collection
    job:
      failed_step_name: '^Collect tests'
    notes: >-
      Collection runs before any test does. A failure here means the matrix
      itself is wrong, and it silently shrinks the denominator for the whole
      run.

  - id: ci-missing-artifact
    class: ci.config
    subclass: missing_artifact
    excerpt_pattern: 'Unable to (find|download) artifact|Artifact not found for name|no files were found with the provided path'
    notes: >-
      A job expected an artifact an upstream job never produced -- usually a
      symptom of an upstream failure rather than a fault in this job.

  - id: ci-tox-env
    class: ci.config
    subclass: tox_env
    excerpt_pattern: "ERROR: (could not install deps|.*InvocationError)|No module named '?(pytest|tox)'?|tox: error: unrecognized arguments"
    notes: The test environment failed to build, so nothing was exercised.

  # ---------------------------------------------------------------------
  # Product bugs.
  #
  # Seeded from nightly run 34172139128 (2,555 jobs, 74 failures) and weekly
  # run 33933942797. Pinned by signature so they cannot over-match.
  # ---------------------------------------------------------------------

  - id: product-node-never-ready
    signature_id: c55cefd2ca3f28e7
    class: product.bug
    subclass: service_not_active
    excerpt_pattern: 'wait_until_k8s_ready'
    notes: >-
      `wait_until_k8s_ready` gives up because a node never reports Ready. The
      single largest failure signature measured: 36 of 74 failures in nightly
      run 34172139128, spanning four different tests and both architectures.
      One root cause, so one signature -- the tests that observe it are
      symptoms, not separate bugs. The bare `AssertionError` carries no
      message, hence the extra excerpt guard so the pin cannot be reused by an
      unrelated messageless assertion.

  - id: product-kube-proxy-inactive
    signature_id: 38c23bd3a1bab957
    class: product.bug
    subclass: service_not_active
    notes: >-
      "Service kube-proxy should be active, but it is inactive" during a
      version downgrade with rollback. 18 occurrences in nightly run
      34172139128. Hashes identically across Ubuntu versions, architectures
      and both self-hosted and GitHub-hosted runners.

  - id: infra-multipass-fixture-never-ready
    signature_id: 8c531e6ba49b3382
    class: infra.provisioning
    subclass: multipass_setup
    job:
      substrate: '^multipass$'
    notes: >-
      The generic retry helper (`util._exec`, "Failed to meet condition")
      giving up while a Multipass instance comes up -- typically polling
      cloud-init. Measured in weekly run 33933942797 across twelve unrelated
      test files (clustering, cleanup, ingress, dns, gateway, smoke, ...),
      which is the tell: when one signature hits every test file at once it is
      shared setup, not a product regression in each of them. Must stay ahead
      of product-retry-condition-never-met, which pins the same signature; the
      excerpt alone cannot distinguish these two cases, only the substrate can.

  - id: product-retry-condition-never-met
    signature_id: 8c531e6ba49b3382
    class: product.bug
    subclass: upgrade_failure
    notes: >-
      The same "Failed to meet condition" signature on the LXD substrate,
      where it is concentrated in test_version_upgrades rather than sprayed
      across the suite: 12 occurrences in nightly run 34172139128 and 2 in the
      datastore spread tests. Here the cluster genuinely fails to reach the
      expected state during an upgrade.

  - id: product-service-restarts
    signature_id: 35b12bf41b664182
    class: product.bug
    subclass: service_not_active
    notes: >-
      "Services have restarted more than 0 time(s): kubelet" during
      test_version_upgrades. kubelet restarting mid-upgrade is a product
      fault, not a test artefact.

  - id: product-service-restarts-rollback
    signature_id: '867525576ccca976'
    class: product.bug
    subclass: upgrade_failure
    notes: >-
      Same kubelet-restart symptom as product-service-restarts, but observed
      during downgrade-with-rollback. Kept separate because the rollback path
      is distinct code with a distinct owner.

  - id: product-containerd-image-import
    signature_id: '96001693f7bb9dbb'
    class: product.bug
    subclass: api_error
    notes: >-
      `ctr image import` exits non-zero inside the instance during
      test_containerd.

  # ---------------------------------------------------------------------
  # Conformance.
  # ---------------------------------------------------------------------

  - id: product-cncf-conformance
    class: product.bug
    subclass: api_error
    excerpt_pattern: 'test_cncf_conform(a|)ance.*tests failed|assert failed_tests == 0'
    job:
      failed_step_name: '^Run test_cncf_conformance$'
    notes: >-
      Upstream CNCF conformance assertions failing against our distribution.
      Matched on text rather than pinned because the suite exists under two
      spellings across release branches (test_cncf_conformance.py and the
      misspelled test_cncf_conformace.py), which would otherwise need a new
      pin per branch.

  # ---------------------------------------------------------------------
  # Command-wrapper families.
  #
  # The integration harness runs everything through `util.run`, so almost
  # every product failure surfaces as the same CalledProcessError frame and
  # the only discriminator left in the excerpt is the command it wrapped.
  # Matching on that command is therefore how the long tail gets owned:
  # these five rules cover ~1,300 occurrences that were previously unknown.
  #
  # They sit below the external.dependency rules on purpose. Those match the
  # underlying store/registry error text, so when a real external cause is
  # visible it still wins and these never see the failure.
  # ---------------------------------------------------------------------

  - id: product-wait-for-timeout
    class: product.bug
    subclass: wait_for_timeout
    excerpt_pattern: "k8s x-wait-for (network|dns|kube-system-ready|[a-z-]+).{0,40}--timeout"
    notes: >-
      `k8s x-wait-for <subsystem>` exhausted its own timeout -- 20 minutes in
      every observed case. The product was asked whether it had converged, it
      said no for twenty minutes, and it is the product that owns that answer.
      The largest unowned family in the 90-day backfill (757 occurrences
      across two signatures, network and dns).

  - id: product-join-failure
    class: product.bug
    subclass: join_failure
    excerpt_pattern: "k8s join-cluster"
    notes: >-
      A node failed to join the cluster. Only became classifiable once the
      scrubber stopped dropping the whole line: the join token is a base64
      blob, so every one of these excerpts used to end at
      "<line dropped: possible secret>" with the command invisible.
      200 occurrences across two signatures.

  - id: product-cluster-never-ready
    class: product.bug
    subclass: cluster_never_ready
    excerpt_pattern: "k8s status --wait-ready"
    notes: >-
      `k8s status --wait-ready` returned non-zero, so the cluster never
      reached a ready state. Distinct from wait_for_timeout because it is the
      aggregate readiness check rather than one subsystem, and distinct from
      product-node-never-ready which is the harness-side assertion.
      230 occurrences.

  - id: product-bootstrap-failure
    class: product.bug
    subclass: bootstrap_failure
    excerpt_pattern: "k8s bootstrap"
    notes: >-
      `k8s bootstrap` failed outright. Nothing downstream of it in the test
      can be meaningful, so this is deliberately ranked above the readiness
      rules -- a bootstrap failure that also times out waiting should be
      reported as the bootstrap failure. 74 occurrences.

  - id: product-snap-install-failure
    class: product.bug
    subclass: snap_install_failure
    excerpt_pattern: "snap (install|refresh) k8s"
    notes: >-
      Installing or refreshing our own snap from a published channel failed.
      Attributed to the product rather than the store because the
      external.dependency rules above match the store's own error text and
      are evaluated first; if the store had said anything, this rule would
      never have been reached. What remains is our snap failing to install
      from a channel the store served. Caveat recorded honestly: the excerpt
      captures the harness wrapper, not the snapd output, so the underlying
      reason is not visible -- improving that extraction would let this split
      into real subclasses.

  - id: infra-missing-tool
    class: infra.runner
    subclass: missing_tool
    excerpt_pattern: ": command not found|FileNotFoundError: \\[Errno 2\\] No such file or directory: '(lxc|lxd|multipass|snap|zip|jq|kubectl)'"
    notes: >-
      A binary the workflow assumes is present is absent from the runner
      image -- observed as `zip: command not found` on self-hosted runners,
      where the image is ours to fix and drifts from the GitHub-hosted one.
      Infra rather than ci.config because the workflow is not wrong; the
      machine it was given is incomplete.

  # ---------------------------------------------------------------------
  # Test bugs. Last: only reached when nothing above claimed the failure.
  # ---------------------------------------------------------------------

  - id: product-service-should-be-inactive
    class: product.bug
    subclass: service_not_active
    excerpt_pattern: "Unexpected service \\S+ is active but should be inactive"
    notes: >-
      The mirror image of product-kube-proxy-inactive: a service that should
      have been stopped is still running. Same subclass because the ownership
      and the underlying concern -- service lifecycle not being honoured --
      are identical; the direction of the error does not change who fixes it.
      50 occurrences.

  - id: product-service-not-active-text
    class: product.bug
    subclass: service_not_active
    excerpt_pattern: "Service \\S+ should be active, but it is inactive"
    notes: >-
      The text form of product-kube-proxy-inactive, which is pinned by
      signature alone. Pins are exact by design, so the same assertion
      arriving under a different signature -- different surrounding frames,
      a different service name -- slipped past it and sat in unknown. This
      rule generalises on the message; the pin above still wins for the
      signature it names, so the attribution of already-classified failures
      does not move.

  - id: product-gateway-ip-missing
    class: product.bug
    subclass: networking
    excerpt_pattern: "No Gateway IP found|AssertionError: No LoadBalancer IP"
    notes: >-
      The gateway or load-balancer never got an address, so the networking
      feature did not finish coming up.

  - id: product-upgrade-crd
    class: product.bug
    subclass: upgrade_failure
    excerpt_pattern: "upgrade CRD should (not )?be created|AssertionError: upgrade .{0,40}(CRD|custom resource)"
    notes: >-
      The upgrade custom resource is in the wrong state -- created when the
      test expected none, or absent when it expected one. Either way it is
      the upgrade controller's own bookkeeping.

  - id: product-fips-not-enforced
    class: product.bug
    subclass: api_error
    excerpt_pattern: "k8sd should fail with FIPS enabled|Expected pods .{0,60}to fail with FIPS error"
    notes: >-
      FIPS enforcement did not happen: the product was expected to refuse a
      non-compliant configuration and accepted it instead. A silent failure
      to enforce is worth ranking as a product bug rather than a test
      nuisance, because the test passing would be the dangerous outcome.

  - id: test-empty-command-output
    class: test.bug
    subclass: bad_assumption
    excerpt_pattern: "json\\.decoder\\.JSONDecodeError: Expecting value: line 1 column 1 \\(char 0\\)"
    notes: >-
      The harness parsed a command's stdout as JSON and got nothing. The
      product may well have failed first, but the test discarded whatever it
      said and reported a parse error instead, so the evidence needed to
      blame the product no longer exists. Attributed to the test because the
      fix is in the test: check the exit status and surface stderr before
      parsing.

  - id: test-harness-bug
    class: test.bug
    subclass: harness_bug
    excerpt_pattern: "tests/test_util/.*\\n.*\\n?.*(TypeError|AttributeError|NameError|ImportError)|BaseRetrying\\.__init__\\(\\) got an unexpected keyword"
    notes: >-
      The test harness itself raised, so no product code was ever exercised.
      Found as 252 occurrences of
      `BaseRetrying.__init__() got an unexpected keyword argument 'delay_3'`
      -- `util.py` passing a malformed kwarg to tenacity, which fails every
      test that uses the retry helper regardless of product state. Worth
      calling out as its own subclass precisely because it is cheap to fix
      and was invisible while it sat in the unknown bucket.

  - id: test-timeout-too-short
    class: test.bug
    subclass: timeout_too_short
    excerpt_pattern: 'Failed: Timeout >\d+\.\d+s|tenacity\.RetryError.*stop_after_delay|TimeoutError: wait timed out after \d+s'
    notes: >-
      pytest's own timeout fired, meaning the test never reached an
      assertion. Classified as a test bug because a test that cannot state
      what went wrong cannot be actioned by anyone else.
